<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 5 — Making Compounds & Precipitates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a2838; --muted:#6b6880; --paper:#f7f4ec; --card:#ffffff;
  --indigo:#3b38a8; --indigo-d:#26246e; --teal:#0e9594; --coral:#ff5d54;
  --amber:#ffb020; --good:#2e9e5b; --bad:#e05252; --line:#e7e2d5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Mali',cursive;background:var(--paper);color:var(--ink);overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:radial-gradient(#d8d2c2 1.2px,transparent 1.2px);background-size:26px 26px;opacity:.35}

/* ---------- chrome ---------- */
#prog{position:fixed;top:0;left:0;right:0;height:7px;background:#e8e4d8;z-index:60}
#progfill{height:100%;width:0;background:linear-gradient(90deg,var(--indigo),var(--teal));transition:width .35s}
#scorechip{position:fixed;top:16px;right:16px;z-index:60;background:#fff;border:2px solid var(--line);
  border-radius:999px;padding:5px 16px;font-weight:700;font-size:.95rem;box-shadow:0 6px 18px rgba(40,38,80,.12)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:10px;align-items:center;
  background:#fff;padding:9px 14px;border-radius:999px;box-shadow:0 10px 30px rgba(40,38,80,.2);z-index:60;border:1px solid var(--line)}
.navbtn{font-family:inherit;font-weight:700;font-size:.95rem;border:none;border-radius:999px;padding:8px 18px;
  background:var(--indigo);color:#fff;cursor:pointer;transition:.2s}
.navbtn:hover:not(:disabled){background:var(--indigo-d);transform:translateY(-2px)}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn.ghost{background:transparent;color:var(--indigo);border:2px solid var(--indigo)}
.navbtn.ghost:hover:not(:disabled){background:#f1efff}
.counter{font-weight:700;color:var(--muted);min-width:100px;text-align:center;font-size:.95rem}

/* ---------- slides ---------- */
.slide{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:64px 22px 96px;opacity:0;visibility:hidden;transform:translateY(20px);transition:.45s ease;z-index:1}
.slide.active{opacity:1;visibility:visible;transform:none;z-index:5}
.card{background:var(--card);border-radius:26px;box-shadow:0 18px 50px rgba(40,38,80,.13);
  padding:42px 52px;width:min(1060px,94vw);max-height:calc(100vh - 175px);overflow:auto;border:1px solid var(--line)}
.card.quiz{border-top:8px solid var(--teal)}
.card.hangman{border-top:8px solid var(--coral)}
.kick{font-size:.8rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--indigo);font-weight:700;margin-bottom:6px}
.card h2{font-size:clamp(1.5rem,3vw,2.3rem);margin-bottom:16px;line-height:1.25}
.card p{font-size:clamp(.98rem,1.6vw,1.2rem);margin:.5em 0;line-height:1.65}
ul{list-style:none}
.card ul li{padding-left:1.6em;position:relative;margin:.5em 0;font-size:clamp(.95rem,1.55vw,1.18rem);line-height:1.6}
.card ul li::before{content:"▸";color:var(--coral);position:absolute;left:0;font-weight:700}
.box{background:#fff6e0;border-left:6px solid var(--amber);padding:12px 18px;border-radius:0 14px 14px 0;
  margin:14px 0;font-size:clamp(.92rem,1.45vw,1.12rem);line-height:1.6}
.box.info{background:#eaf6ff;border-color:#3b9ae1}
.box.good{background:#e9f8ef;border-color:var(--good)}
.box.bad{background:#fdecec;border-color:var(--bad)}
.eq{display:flex;gap:.6em;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700;
  font-size:clamp(1.15rem,2.3vw,1.7rem);background:#f1efff;border:2px dashed var(--indigo);padding:16px 20px;
  border-radius:16px;margin:18px 0}
.eq .r{color:var(--indigo)} .eq .p{color:var(--teal)} .eq .arrow{color:var(--coral)}
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:clamp(.88rem,1.4vw,1.08rem)}
.tbl th{background:var(--indigo);color:#fff;padding:10px 14px;text-align:left}
.tbl td{border-bottom:2px solid var(--line);padding:10px 14px;vertical-align:top;line-height:1.55}
.tbl tr:nth-child(even) td{background:#faf8f2}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.signs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:14px 0}
.sign{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center;font-size:clamp(.9rem,1.4vw,1.05rem)}
.sign .emo{font-size:1.9rem;display:block;margin-bottom:4px}
.sign b{display:block;color:var(--indigo)}
.tag{display:inline-block;background:#eee9ff;color:var(--indigo);border-radius:999px;padding:2px 12px;
  font-size:.85rem;font-weight:600;margin:3px 3px 0 0}
.fig{max-width:100%;height:auto;margin:8px auto;display:block}
.figcap{text-align:center;color:var(--muted);font-size:.9rem;margin-top:2px}
.photo-figure{max-width:840px;margin:16px auto;text-align:center}
.photo-figure img{display:block;max-width:100%;max-height:360px;width:auto;height:auto;object-fit:contain;object-position:center;margin:0 auto;border:2px solid var(--line);border-radius:14px;box-shadow:0 5px 16px rgba(40,38,80,.12)}
.chemistry-illustration{display:block;width:min(100%,720px);height:auto;margin:0 auto;border:2px solid var(--line);border-radius:14px;box-shadow:0 5px 16px rgba(40,38,80,.12)}
.photo-figure .figcap{margin-top:7px}
.checklist li::before{content:"☐" !important;color:var(--teal);font-size:1.15em}

/* ---------- title / end slides ---------- */
.title-slide{background:linear-gradient(135deg,#33307f 0%,#211f63 60%,#1a1860 100%)}
.title-slide::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;
  background-image:radial-gradient(#ffffff 1.4px,transparent 1.4px);background-size:30px 30px}
.tcenter{position:relative;z-index:2;text-align:center;color:#fff;max-width:900px;padding:20px}
.tcenter .kick{color:var(--amber);letter-spacing:4px}
.tcenter h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.15;margin:10px 0}
.tsub{font-size:clamp(1.05rem,2vw,1.4rem);opacity:.92;line-height:1.6}
.chiprow{margin-top:22px}
.chip{display:inline-block;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.45);
  border-radius:999px;padding:4px 16px;font-size:.95rem;font-weight:600;margin:4px}
.navhint{margin-top:30px;font-size:.9rem;opacity:.75}
.stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:28px 0}
.stat{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.4);border-radius:18px;
  padding:14px 26px;min-width:150px}
.stat b{display:block;font-size:2.2rem;color:var(--amber)}
.stat span{font-size:.9rem;opacity:.9}
.restart{font-family:inherit;font-weight:700;font-size:1.05rem;border:none;border-radius:999px;
  padding:12px 30px;background:#fff;color:var(--indigo-d);cursor:pointer;transition:.2s}
.restart:hover{transform:translateY(-2px)}

/* ---------- quiz ---------- */
.qhead{font-weight:700;color:var(--teal);letter-spacing:1.5px;text-transform:uppercase;font-size:.85rem;margin-bottom:4px}
.qhead.hm{color:var(--coral)}
.q-question{font-size:clamp(1.12rem,2vw,1.45rem);font-weight:700;margin:6px 0 16px;line-height:1.5}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#f7f5ef;
  border:2px solid var(--line);border-radius:14px;padding:11px 16px;margin:10px 0;cursor:pointer;
  font-family:inherit;font-size:clamp(.92rem,1.5vw,1.12rem);transition:.2s;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--indigo);transform:translateY(-2px);background:#fbfaff}
.opt:disabled{cursor:default}
.opt .badge{flex:0 0 32px;height:32px;border-radius:50%;background:var(--indigo);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.opt.correct{background:#e5f7ec;border-color:var(--good)}
.opt.correct .badge{background:var(--good)}
.opt.wrong{background:#fdeaea;border-color:var(--bad);animation:shake .3s}
.opt.wrong .badge{background:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.explain{display:none}.explain.show{display:block}

/* ---------- hangman ---------- */
.hm-wrap{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start;margin-top:6px}
.hm-left{text-align:center}
.hm-svg{width:100%;max-width:240px}
.hp{opacity:0;transition:opacity .3s}
.hp.on{opacity:1}
.hearts{display:flex;gap:5px;justify-content:center;font-size:1.25rem;margin-top:6px}
.word{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.bl{width:36px;height:48px;border-bottom:4px solid var(--indigo);display:flex;align-items:flex-end;
  justify-content:center;font-size:1.7rem;font-weight:700}
.bl span{opacity:0;transform:translateY(8px);transition:.25s;color:var(--teal)}
.bl.revealed span{opacity:1;transform:none}
.bl.losecolor span{opacity:1;transform:none;color:var(--coral)}
.kb{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;margin-top:12px}
.kb button{padding:8px 0;border-radius:10px;border:2px solid var(--line);background:#fff;
  font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;transition:.15s;color:var(--ink)}
.kb button:hover:not(:disabled){border-color:var(--indigo);background:#f1efff}
.kb button:disabled{cursor:default}
.kb button.hit{background:var(--good);border-color:var(--good);color:#fff}
.kb button.miss{background:var(--bad);border-color:var(--bad);color:#fff;opacity:.85}
.hm-msg{text-align:center;font-weight:700;font-size:1.15rem;margin-top:12px;min-height:1.7em}
.hm-msg.win{color:var(--good)} .hm-msg.lose{color:var(--bad)}
.hm-msg.blocked{color:var(--coral);animation:shake .3s}
.quiz-layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px;align-items:start}
.quiz-box{min-width:0}
.partner.hangman{border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff;box-shadow:0 8px 22px rgba(40,38,80,.1);position:sticky;top:0}
.partner.hangman h3{margin:0 0 3px;font-size:1rem}
.partner.hangman p{margin:0;color:var(--muted);font-size:.76rem}
.partner-svg{width:100%;height:190px;display:block;margin:5px auto}
.gallows{stroke:#aaa3bd;stroke-width:4;fill:none;stroke-linecap:round}
.partner-svg .part{stroke:var(--bad);stroke-width:4;fill:none;stroke-linecap:round;opacity:0}
.partner-svg .part.on{opacity:1;animation:draw .4s ease both}
.hang-note{text-align:center;font-size:.8rem!important;color:var(--muted)!important}
.steps{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:8px}
.step{display:grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#f0edf8;color:#aaa3bd;font-size:.65rem;font-weight:700}
.step.on{background:rgba(226,78,115,.13);color:var(--bad)}
.step.last{box-shadow:0 0 0 2px var(--bad);transform:scale(1.1)}
.hm-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,28,70,.55);backdrop-filter:blur(4px);z-index:90;padding:20px}
.hm-modal.open{display:flex}
.hm-modal-card{max-width:460px;background:#fff;border-radius:22px;padding:28px;text-align:center;box-shadow:0 18px 50px rgba(40,38,80,.25)}
.hm-modal-card h2{color:var(--coral);margin-bottom:10px}
.hm-modal-card p{line-height:1.6;margin:8px 0}
.hm-modal-card button{margin-top:14px;font-family:inherit;font-weight:700;border:0;border-radius:999px;padding:11px 22px;background:var(--indigo);color:#fff;cursor:pointer}

/* ---------- menu ---------- */
#menu{position:fixed;inset:0;background:rgba(30,28,70,.55);backdrop-filter:blur(4px);display:none;z-index:80;padding:34px 18px;overflow:auto}
#menu.open{display:block}
.menu-inner{max-width:920px;margin:auto;background:#fff;border-radius:20px;padding:24px 26px}
.menu-inner h3{margin-bottom:12px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:6px}
.mi{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;cursor:pointer;
  border:2px solid transparent;font-size:.88rem;line-height:1.3}
.mi:hover{background:#f1efff}
.mi.cur{border-color:var(--indigo);background:#f1efff;font-weight:700}
.mi .n{color:var(--muted);min-width:2.3em}
.mi .st{margin-left:auto}

@media(max-width:820px){
  .hm-wrap{grid-template-columns:1fr}
  .quiz-layout{grid-template-columns:1fr}
  .partner.hangman{position:static}
  .grid2{grid-template-columns:1fr}
  .card{padding:28px 24px}
  .kb{grid-template-columns:repeat(7,1fr)}
  .bl{width:30px;height:42px;font-size:1.4rem}
}
</style>
</head>
<body>

<div id="prog"><div id="progfill"></div></div>
<div id="scorechip">⭐ 0 pts · 0 / 36 attempted</div>
<main id="deck"></main>

<nav class="nav">
  <button class="navbtn ghost" id="prevBtn">← Prev</button>
  <div class="counter" id="counter">1 / 110</div>
  <button class="navbtn" id="nextBtn">Next →</button>
  <button class="navbtn ghost" id="menuBtn" title="All slides">☰</button>
</nav>

<div id="menu"><div class="menu-inner">
  <h3>📄 All slides — click to jump</h3>
  <div class="menu-grid" id="menuGrid"></div>
</div></div>

<div id="hmModal" class="hm-modal" aria-hidden="true">
  <div class="hm-modal-card">
    <h2>Hangman set complete</h2>
    <p>You have reached 11 wrong answers. Review the questions, then start a fresh Hangman set.</p>
    <button type="button" id="newHmBtn">Start a new set</button>
  </div>
</div>

const svgCO2 = `

const S = [];

// 01
S.push({type:'title',kicker:K1,title:'Making Compounds',

// 02
S.push({type:'content',kicker:K1,title:'You will learn to…',html:`
  <ul>
    <li>Use <b>observations</b> to identify chemical reactions</li>
    <li>Identify <b>oxygen, carbon dioxide and hydrogen</b> gases using simple tests</li>
    <li>Describe chemical reactions using the <b>particle model</b></li>
    <li>Represent scientific ideas using <b>symbols and formulae</b></li>
  </ul>`});
// 03 Q
// 04
S.push({type:'content',kicker:K1,title:'Starting point — you should know that…',html:`
  <ul>
    <li>Chemical reactions involve substances called <b>reactants</b>, which interact to form new substances called <b>products</b>.</li>
    <li>Changes such as <b>production of gas</b>, <b>colour change</b> or <b>temperature change</b> are evidence that a chemical reaction has taken place.</li>
  </ul>
  <div class="box info">Today we will use these ideas to <b>spot reactions</b> and to <b>model</b> them.</div>`});
// 05
S.push({type:'content',kicker:K1,title:'Starting point — you should be able to…',html:`
  <ul>
    <li>Describe <b>risks</b> when planning an experiment</li>
    <li>Understand how to <b>minimise</b> those risks</li>
  </ul>
  <div class="box">Safety first! We will come back to hazards and risks later in this topic — burning magnesium is spectacular… but risky!</div>`});
// 06 Q
S.push({type:'quiz',q:'In a chemical reaction, what are the NEW substances formed called?',
  opts:['Reactants','Products','Precipitates','Elements'],a:1,
  why:'Reactants interact to form new substances — these new substances are the products.'});
// 07
S.push({type:'content',kicker:K1,title:'Reactants and products',html:`
  <p>In a chemical reaction, substances react together to form <b>new substances</b>.</p>
  <ul>
    <li><b>Reactants</b> — the substances that react together</li>
    <li><b>Products</b> — the new substances formed</li>
  </ul>
  <div class="eq"><span class="r">reactants</span><span class="arrow">→</span><span class="p">products</span></div>`});
// 08
S.push({type:'content',kicker:K1,title:'Word equations',html:`
  <ul>
    <li>A <b>word equation</b> is a type of scientific <b>model</b> that represents a chemical reaction.</li>
    <li>It shows you the <b>names</b> of the reactants and the products in the reaction.</li>
    <li>It is quick and easy to write — but it only uses words.</li>
  </ul>
  <div class="box info"><b>model</b> = a simple way of showing or explaining a complicated object or idea.</div>`});
// 09 Q
// 10
S.push({type:'content',kicker:K1,title:'Magnesium burns in air',html:`
  <ul>
    <li>Magnesium burns in air with a <b>bright white light</b> and gets <b>very hot</b> (Figure 5.1).</li>
    <li>Magnesium and oxygen react together to make <b>magnesium oxide</b>.</li>
  </ul>${photoFigure('5.1_magnesium_burning.jpg','Figure 5.1 - magnesium burning in air')}
  <div class="eq"><span class="r">magnesium + oxygen</span><span class="arrow">→</span><span class="p">magnesium oxide</span></div>`});
// 11
S.push({type:'content',kicker:K1,title:'Reading a word equation',html:`
  <ul>
    <li>The names of the <b>reactants</b> are written on the <b>left</b>.</li>
    <li>The names of the <b>products</b> are written on the <b>right</b>.</li>
    <li>The <b>arrow</b> points from reactants to products — it shows that the reactants <b>make or form</b> the products.</li>
  </ul>
  <div class="eq"><span class="r">magnesium + oxygen</span><span class="arrow">→</span><span class="p">magnesium oxide</span></div>
  <p class="figcap">left = reactants &nbsp;·&nbsp; right = product</p>`});
// 12 Q
S.push({type:'quiz',q:'In a word equation, what does the arrow show?',
  opts:['Products form reactants','Reactants form the products','The reaction is dangerous','The substances are only mixed'],a:1,
  why:'Reactants sit on the left, products on the right — the arrow points from reactants to products.'});
// 13
S.push({type:'content',kicker:K1,title:'The particle model',html:`
  <ul>
    <li>A <b>particle diagram</b> shows the atoms in the reactants and products as <b>circles</b>.</li>
    <li>The way the circles are <b>joined together</b> shows how the atoms are joined in each substance.</li>
  </ul>${photoFigure('5.2_particle_diagram.jpg','Figure 5.2 - magnesium and oxygen atoms form magnesium oxide')}`});
// 14
S.push({type:'content',kicker:K1,title:'Atoms are never lost',html:`
  <ul>
    <li>Atoms are <b>not made or destroyed</b> in chemical reactions — they just <b>join together in different ways</b>.</li>
    <li>So a particle diagram must show the <b>same number of each type of atom</b> on the left and on the right.</li>
  </ul>
  <div class="box good">Check the diagram: Mg atoms 2 → 2 ✅ &nbsp; Oxygen atoms 2 → 2 ✅</div>`});
// 15 Q
S.push({type:'quiz',q:'Why does a particle diagram give you MORE information than a word equation?',
  opts:['It is quicker to draw','It shows how the atoms rearrange and join together','It shows the temperature change','It lists the hazards'],a:1,
  why:'The particle diagram shows how the arrangement of atoms changes — but it is harder to draw than a word equation.'});
// 16
S.push({type:'content',kicker:K1,title:'Comparing the two models',html:`
  <table class="tbl">
    <tr><th>Word equation</th><th>Particle diagram</th></tr>
    <tr><td>Shows the <b>names</b> of reactants and products</td><td>Shows <b>atoms</b> and how they are joined</td></tr>
    <tr><td><b>Quick and easy</b> to write</td><td>Shows how atoms <b>rearrange</b> in the reaction</td></tr>
    <tr><td>Limited — no detail about particles</td><td><b>More difficult</b> to use — you must make a drawing</td></tr>
  </table>
  <div class="box">Every model has <b>strengths</b> and <b>limitations</b> — scientists choose the best model for the job.</div>`});
// 17
S.push({type:'content',kicker:K1,title:'Think like a scientist',html:`
  <div class="box"><b>Question 1</b> — Atoms of different elements can be shown differently in a particle diagram. Suggest how.</div>
  <p>✅ Ideas: give each element its own <b>colour</b>, <b>size</b> or <b>label</b> (like grey Mg and red O).</p>
  <div class="box"><b>Question 2</b> — How can you tell from the particle diagram that magnesium and oxygen are in the reactants AND in the product?</div>
  <p>✅ The <b>same circles</b> (grey Mg, red O) appear on <b>both sides</b> — they have simply rearranged.</p>`});
// 18 Q
// 19
S.push({type:'content',kicker:K1,title:'Two elements react',html:`
  <div class="grid2">
    <div class="sign"><span class="emo">🔩</span><b>Magnesium</b>an <b>element</b> — a light grey metal</div>
    <div class="sign"><span class="emo">💨</span><b>Oxygen</b>an <b>element</b> — a colourless gas</div>
  </div>
  <p style="text-align:center">Elements contain only <b>one kind of atom</b>. Together they can make something completely new…</p>`});
// 20
S.push({type:'content',kicker:K1,title:'A brand-new substance: a compound',html:`
  <ul>
    <li>When magnesium (A) is heated it reacts with oxygen in the air to form a <b>white solid</b> (B) — Figure 5.3.</li>
    <li><b>Magnesium oxide is a compound</b> — it contains magnesium and oxygen atoms, <b>strongly held together</b>.</li>
    <li>Its properties are <b>different</b> from the properties of the elements it is made from.</li>
  </ul>${photoFigure('5.3_magnesium_oxide.jpg','Figure 5.3 - magnesium changes into magnesium oxide')}
  <div class="box info"><b>compound</b> = a substance that contains atoms of more than one element strongly held together.</div>`});
// 21 Q
S.push({type:'quiz',q:'Which statement best describes a compound?',
  opts:['Two substances stirred together that keep their own properties','A substance containing atoms of more than one element strongly held together','Any substance that conducts electricity','A solid that will not dissolve in water'],a:1,
  why:'A compound contains atoms of different elements strongly held together — and it has new, different properties.'});
// 22
S.push({type:'content',kicker:K1,title:'Completely new properties',html:`
  <table class="tbl">
    <tr><th>Substance</th><th>Appearance / properties</th></tr>
    <tr><td><b>Magnesium</b> (element)</td><td>light grey, shiny, flexible <b>metal</b></td></tr>
    <tr><td><b>Oxygen</b> (element)</td><td>colourless, invisible <b>gas</b></td></tr>
    <tr><td><b>Magnesium oxide</b> (compound)</td><td><b>white, brittle solid</b> — nothing like either element!</td></tr>
  </table>`});
// 23
S.push({type:'content',kicker:K1,title:'Separating a compound',html:`
  <ul>
    <li>A compound can <b>only</b> be separated into the elements it contains by using <b>chemical reactions</b>.</li>
    <li>This is <b>difficult</b> to do — unlike a mixture, you cannot simply filter or pick the parts out.</li>
  </ul>
  <div class="box bad">⚠ Not easy to undo! Making a compound is a <b>chemical</b> change, not a physical one.</div>`});
// 24 Q
// 25
S.push({type:'content',kicker:K1,title:'Iron + sulfur — the setup',html:`
  <p>A teacher heats <b>iron</b> and <b>sulfur</b> together. A new substance, <b>iron sulfide</b>, is produced.</p>
  <div class="eq"><span class="r">iron + sulfur</span><span class="arrow">→</span><span class="p">iron sulfide</span></div>
  <div class="box"><b>Your questions:</b><br>a) Name the two elements.<br>b) Name the compound.<br>c) Explain why this is a chemical reaction.</div>`});
// 26
S.push({type:'content',kicker:K1,title:'Iron + sulfur — the answers',html:`
  <ul>
    <li>a) The elements: <b>iron</b> and <b>sulfur</b></li>
    <li>b) The compound: <b>iron sulfide</b></li>
    <li>c) It is a chemical reaction because a <b>new substance</b> with <b>different properties</b> is formed — the atoms have rearranged and joined together in a new way.</li>
  </ul>`});
// 27 Q
S.push({type:'quiz',q:'Iron is heated with sulfur and iron sulfide forms. Which statement is TRUE?',
  opts:['Iron sulfide is an element','Iron sulfide is a compound','Iron and sulfur never react','The product keeps the properties of iron'],a:1,
  why:'Iron sulfide contains atoms of two different elements (iron and sulfur) strongly held together — so it is a compound.'});
// 28
S.push({type:'content',kicker:K1,title:'Evidence 1 — temperature change',html:`
  <ul>
    <li>The reaction mixture gets <b>very hot</b> when magnesium burns in air.</li>
    <li>There is often a <b>temperature change</b> like this during a reaction.</li>
    <li>However — you can often tell a reaction is happening just by <b>watching carefully</b>…</li>
  </ul>
  <div class="signs">
    <div class="sign"><span class="emo">🫧</span><b>Gas given off</b>coming up…</div>
    <div class="sign"><span class="emo">🎨</span><b>Colour change</b>coming up…</div>
    <div class="sign"><span class="emo">☁️</span><b>Precipitate</b>coming up…</div>
  </div>`});
// 29
S.push({type:'content',kicker:K1,title:'Evidence 2 — reactant used up + gas',html:`
  <ul>
    <li><b>Sodium hydrogen carbonate</b> (baking soda) reacts with <b>ethanoic acid</b> (vinegar) — Figure 5.4.</li>
    <li>The sodium hydrogen carbonate <b>gradually disappears</b> as it is used up.</li>
    <li><b>Bubbles of gas</b> are given off.</li>
  </ul>${photoFigure('5.4_baking_soda_vinegar.jpg','Figure 5.4 - baking soda reacts with vinegar')}
  <div class="box info">You will learn to identify this gas with simple tests very soon!</div>`});
// 30 Q
S.push({type:'quiz',q:'Baking soda is added to vinegar. Which observations show a chemical reaction?',

  why:'The reactant being used up and a gas being produced are both evidence of a chemical reaction.'});
// 31
S.push({type:'content',kicker:K1,title:'Evidence 3 — colour change',html:`
  <ul>
    <li><b>Zinc metal</b> reacts with <b>copper sulfate solution</b> — Figure 5.5.</li>
    <li>The solution changes from <span style="color:#2f6bd8;font-weight:700">blue</span> to <b>colourless</b> as the copper sulfate is used up.</li>
    <li>The zinc becomes coated with <span style="color:#b5651d;font-weight:700">brown copper</span>.</li>
  </ul>${photoFigure('5.5_zinc_copper_sulfate.jpg','Figure 5.5 - zinc reacts with copper sulfate solution')}
  <div class="box info">Reactants and products may have <b>different colours</b> — so look for a colour change!</div>`});
// 32
S.push({type:'content',kicker:K1,title:'Evidence 4 — a precipitate!',html:`
  <ul>
    <li>Some solutions react together to produce a solid called a <b>precipitate</b>.</li>
    <li>It appears as a <b>cloudy</b> white or coloured substance in the reaction mixture.</li>
    <li><b>Lead nitrate + potassium iodide:</b> two colourless solutions → a <b>yellow precipitate</b> (Figure 5.6).</li>
  </ul>
  ${photoFigure('5.6_yellow_precipitate.jpg','Figure 5.6 - a yellow precipitate forms')}
  `});
// 33 Q
// 34
S.push({type:'content',kicker:K1,title:'Four ways to spot a reaction',html:`
  <div class="signs">
    <div class="sign"><span class="emo">🫧</span><b>Gas given off</b>bubbles appear</div>
    <div class="sign"><span class="emo">🎨</span><b>Colour change</b>new colours appear</div>
    <div class="sign"><span class="emo">🌡️</span><b>Temperature change</b>hotter or colder</div>
    <div class="sign"><span class="emo">☁️</span><b>Precipitate forms</b>mixture goes cloudy</div>

  <div class="box">Also: watch the <b>reactant being used up</b> (like the disappearing baking soda)!</div>`});

S.push({type:'content',kicker:K1,title:'Testing for hydrogen',html:`
  <ul>
    <li>Bubbles are given off when <b>magnesium</b> reacts with <b>dilute hydrochloric acid</b>.</li>
    <li>Hold a <b>lighted wooden splint</b> near the mouth of a test tube of the gas.</li>
    <li>The gas ignites with a <b>'pop' sound</b> if it is hydrogen!</li>

S.push({type:'content',kicker:K1,title:'Why the pop?',html:`
  <ul>
    <li>The test works because hydrogen is <b>flammable</b> and burns <b>very quickly</b>.</li>
    <li>The rapid burning of the gas makes the <b>'pop'</b> sound.</li>

// 38

    <li>Some substances are <b>soluble</b> in water — they dissolve to form a <b>clear solution</b>.</li>
    <li>You can see <b>through</b> solutions because the dissolved particles are <b>far too small to see</b>.</li>
    <li><b>Sodium chloride</b> (common table salt) is soluble → it dissolves to form sodium chloride solution.</li>
  </ul>`});

    <li>If you mix an insoluble substance with water, you can <b>still see the substance</b>.</li>
    <li>This makes the mixture <b>cloudy</b>.</li>
    <li><b>Calcium carbonate</b> is an insoluble white solid → the water goes cloudy (Figure 5.11).</li>

    <li>As it <b>cannot dissolve</b> in the reaction mixture, a precipitate turns the mixture <b>cloudy</b>.</li>
    <li>A reaction in which a precipitate forms is called a <b>precipitation reaction</b>.</li>
  </ul>`});

  opts:['No reaction — all the substances are soluble','An insoluble precipitate of barium sulfate forms','A blue precipitate of copper hydroxide','Hydrogen gas is given off'],a:1,

  <ul class="checklist">

// 108 Q
// 109
S.push({type:'content',kicker:'Chapter 5',title:'The big picture 🧪',html:`
  <div class="grid2">
    <div class="sign" style="text-align:left"><span class="emo">🔥</span><b>Topic 1 — Making compounds</b>
      <ul style="margin-top:8px">

        <li>compounds have new properties</li>

    <div class="sign" style="text-align:left"><span class="emo">☁️</span><b>Topic 2 — Forming precipitates</b>

        <li>soluble vs insoluble</li>

      </ul>
    </div>
  </div>`});
// 110
S.push({type:'end'});

/* =========================================================
   ENGINE — rendering, navigation, quiz & hangman
   ========================================================= */
const deck = document.getElementById('deck');
const TOTAL_Q = S.filter(s => s.type==='quiz').length;
let cur = -1, curEl = null, score = 0, answered = 0;
const els = [];
const C = {maxWrong:11, key:'sci-ch5-progress-v1'};
const fresh = () => ({hangmanParts:0, hangmanPending:false, wrongChoices:{}, correctQuizIds:[], attemptedIds:[]});
let state = fresh();
function readState(){
  try{
    const saved = JSON.parse(localStorage.getItem(C.key) || 'null');
    if (saved && typeof saved === 'object') state = {...fresh(), ...saved};
  }catch(e){ state = fresh(); }
  state.hangmanParts = Math.max(0, Math.min(C.maxWrong, Number(state.hangmanParts) || 0));
  state.hangmanPending = Boolean(state.hangmanPending);
  state.wrongChoices = state.wrongChoices && typeof state.wrongChoices === 'object' ? state.wrongChoices : {};
  state.correctQuizIds = Array.isArray(state.correctQuizIds) ? state.correctQuizIds : [];
  state.attemptedIds = Array.isArray(state.attemptedIds) ? state.attemptedIds : [];
  return state;
}
function saveState(){try{localStorage.setItem(C.key, JSON.stringify(state));}catch(e){}}

const chip = () => document.getElementById('scorechip').textContent =
  `⭐ ${score} pts · ${answered} / ${TOTAL_Q} attempted`;

const HANGMAN_PARTS = [
  '<circle cx="124" cy="45" r="17"/>',
  '<path d="M124 62v48"/>',
  '<path d="M124 72 96 94"/>',
  '<path d="M124 72 152 94"/>',
  '<path d="M124 110 101 145"/>',
  '<path d="M124 110 147 145"/>',
  '<path d="M124 34q-16-14-31 0"/>',
  '<path d="M117 46h2M130 46h2"/>',
  '<path d="M117 55q7 5 14 0"/>',
  '<path d="M124 20v-7"/>',
  '<circle cx="124" cy="9" r="4"/>'
];

function hangmanPartner(){
  const n = state.hangmanParts;
  return `<aside class="hangman partner">
    <h3>Hangman partner</h3>
    <p>${C.maxWrong} wrong answers completes one set</p>
    <svg class="partner-svg" viewBox="0 0 180 175" aria-label="${n} of ${C.maxWrong} Hangman parts drawn">
      <path class="gallows" d="M20 157h135M45 157V20h82v18"/>
      ${HANGMAN_PARTS.map((p,i)=>`<g class="part ${i<n?'on':''}">${p}</g>`).join('')}
    </svg>
    <p class="hang-note"><b>${n}/${C.maxWrong}</b> wrong${state.hangmanPending?'<br>Set complete — start a new one':''}</p>
    <div class="steps">${Array.from({length:C.maxWrong},(_,i)=>`<span class="step ${i<n?'on':''} ${i===n-1?'last':''}">${i+1}</span>`).join('')}</div>
  </aside>`;
}

function buildTitle(s){
  return `<div class="tcenter">
    <div class="kick">${s.kicker}</div>
    <h1>${s.title}</h1>
    <p class="tsub">${s.sub}</p>
    <div class="chiprow">${(s.chips||[]).map(c=>`<span class="chip">${c}</span>`).join('')}</div>
    <p class="navhint">Use ← / → arrow keys (or Space) · or the buttons below</p>
  </div>`;
}
function buildContent(s){
  return `<div class="card"><div class="kick">${s.kicker}</div><h2>${s.title}</h2>${s.html}</div>`;
}
function buildQuiz(s){
  const bd = ['A','B','C','D'];
  const wrong = state.wrongChoices[s.id] || [];
  const correct = state.correctQuizIds.includes(s.id);
  return `<div class="card quiz">
    <div class="qhead">🎯 Quick check</div>
    <div class="quiz-layout"><div class="quiz-box">
      <div class="q-question">${s.q}</div>
      ${s.opts.map((o,i)=>`<button type="button" class="opt ${wrong.includes(i)?'wrong':''} ${correct&&i===s.a?'correct':''}" ${wrong.includes(i)||correct?'disabled':''}><span class="badge">${bd[i]}</span><span>${o}</span></button>`).join('')}
      <div class="explain box info ${correct?'show':''}"><b>Why:</b> ${s.why}</div>
    </div>${hangmanPartner()}</div>
  </div>`;
}
function buildEnd(){
  return `<div class="tcenter">
    <div class="kick">Chapter 5 · Complete</div>
    <h1>🎓 Well done!</h1>
    <p class="tsub">You have finished both topics:<br><b>Making Compounds</b> & <b>Forming Precipitates</b></p>
    <div class="stats">
      <div class="stat"><b id="finScore">0</b><span>points earned</span></div>
      <div class="stat"><b id="finAns">0</b><span>questions attempted</span></div>
      <div class="stat"><b id="finTot">0</b><span>total questions</span></div>
    </div>
    <button type="button" class="restart" onclick="location.reload()">↻ Restart the deck</button>
  </div>`;
}

function wireQuiz(sec, s){
  const opts = [...sec.querySelectorAll('.opt')];
  const wrong = new Set(state.wrongChoices[s.id] || []);
  const isCorrect = () => state.correctQuizIds.includes(s.id);
  opts.forEach((b, i) => b.addEventListener('click', () => {
    if (state.hangmanPending || isCorrect() || wrong.has(i)) return;
    if (!state.attemptedIds.includes(s.id)){
      state.attemptedIds.push(s.id);
      answered++;
    }
    if (i === s.a){
      state.correctQuizIds.push(s.id);
      score++;
      b.classList.add('correct');
      opts.forEach(o => o.disabled = true);
      sec.dataset.done = 1;
      sec.querySelector('.explain').classList.add('show');
      document.getElementById('nextBtn').disabled = false;
    } else {
      wrong.add(i);
      (state.wrongChoices[s.id] ||= []).push(i);
      state.hangmanParts = Math.min(C.maxWrong, state.hangmanParts + 1);
      b.classList.add('wrong');
      b.disabled = true;
      if (state.hangmanParts >= C.maxWrong) state.hangmanPending = true;
    }
    saveState();
    renderPartner(sec);
    if (state.hangmanPending) openHangmanModal();
    chip();
  }));
}

function renderPartner(sec){
  const n = state.hangmanParts;
  sec.querySelectorAll('.partner-svg .part').forEach((p,i) => p.classList.toggle('on', i < n));
  const note = sec.querySelector('.hang-note');
  if (note) note.innerHTML = `<b>${n}/${C.maxWrong}</b> wrong${state.hangmanPending?'<br>Set complete — start a new one':''}`;
  sec.querySelector('.steps').innerHTML = Array.from({length:C.maxWrong},(_,i)=>`<span class="step ${i<n?'on':''} ${i===n-1?'last':''}">${i+1}</span>`).join('');
}

function openHangmanModal(){
  if (!state.hangmanPending) return;
  const modal = document.getElementById('hmModal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden','false');
}
function closeHangmanModal(){
  const modal = document.getElementById('hmModal');
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden','true');
}
function resetHangman(){
  state.hangmanParts = 0;
  state.hangmanPending = false;
  saveState();
  closeHangmanModal();
  if (curEl && S[cur] && S[cur].type === 'quiz') renderPartner(curEl);
}

function ensure(i){
  if (els[i]) return els[i];
  const s = S[i];
  const sec = document.createElement('section');
  sec.className = 'slide' + ((s.type==='title'||s.type==='end') ? ' title-slide' : '');
  sec.innerHTML = s.type==='title' ? buildTitle(s)
                : s.type==='content'? buildContent(s)
                : s.type==='quiz'   ? buildQuiz(s)
                : buildEnd();
  deck.appendChild(sec);
  if (s.type==='quiz') wireQuiz(sec, s);
  els[i] = sec;
  return sec;
}

function show(i){
  i = Math.max(0, Math.min(S.length-1, i));
  if (curEl) curEl.classList.remove('active');
  cur = i;
  curEl = ensure(i);
  const card = curEl.querySelector('.card'); if (card) card.scrollTop = 0;
  curEl.classList.add('active');
  document.getElementById('counter').textContent = `${i+1} / ${S.length}`;
  document.getElementById('progfill').style.width = ((i+1)/S.length*100) + '%';
  document.getElementById('prevBtn').disabled = (i===0);
  document.getElementById('nextBtn').disabled = (i===S.length-1) || (S[i].type==='quiz' && !state.correctQuizIds.includes(S[i].id));
  if (S[i].type==='end'){
    document.getElementById('finScore').textContent = score;
    document.getElementById('finAns').textContent = answered;
    document.getElementById('finTot').textContent = TOTAL_Q;
  }
  if (state.hangmanPending && S[i].type==='quiz') setTimeout(openHangmanModal, 80);
}
function next(){
  const s = S[cur];
  if (state.hangmanPending){ openHangmanModal(); return; }
  if (s && s.type === 'quiz' && !state.correctQuizIds.includes(s.id)) return;
  show(cur+1);
}
const prev = () => show(cur-1);

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);

/* keyboard */
document.addEventListener('keydown', e => {
  const menu = document.getElementById('menu');
  if (menu.classList.contains('open')){ if (e.key==='Escape') menu.classList.remove('open'); return; }
  if (e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
  else if (e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
});

/* swipe */
let tx = 0;
document.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 60) (dx < 0 ? next() : prev());
}, {passive:true});

/* jump menu */
const label = (s,i) => s.type==='title' ? `📘 ${s.title}`
  : s.type==='content' ? s.title
  : s.type==='quiz' ? '🎯 ' + s.q.slice(0,30) + '…'
  : '🏁 The End';

function openMenu(){
  const g = document.getElementById('menuGrid');
  g.innerHTML = S.map((s,i)=>{
    const done = els[i] && els[i].dataset.done;
    return `<div class="mi ${i===cur?'cur':''}" data-i="${i}">
      <span class="n">${i+1}</span><span>${label(s,i)}</span>
      <span class="st">${done ? (done==='1' ? '✅' : '') : ''}</span></div>`;
  }).join('');
  g.querySelectorAll('.mi').forEach(m => m.addEventListener('click', () => {
    document.getElementById('menu').classList.remove('open');
    show(+m.dataset.i);
  }));
  document.getElementById('menu').classList.add('open');
}
document.getElementById('menuBtn').addEventListener('click', openMenu);
document.getElementById('menu').addEventListener('click', e => {
  if (e.target.id==='menu') e.target.classList.remove('open');
});
document.getElementById('newHmBtn').addEventListener('click', resetHangman);

/* start */
readState();
score = state.correctQuizIds.length;
answered = state.attemptedIds.length;
chip();
show(0);
if (state.hangmanPending) setTimeout(openHangmanModal, 80);
</script>
</body>
</html>
