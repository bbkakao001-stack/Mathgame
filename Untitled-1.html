<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alge-Buddy · Manipulating Expressions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0a0814; --bg-1:#161228; --bg-2:#1f1a3a; --panel:#1a1530;
  --line:#2a2455; --txt:#ece8ff; --muted:#8a82b8;
  --pink:#ff3d8b; --pink-glow:#ff6bb5;
  --cyan:#4dd0ff; --yellow:#ffd84d; --green:#4dffa1; --red:#ff5a5a;
}
*{margin:0;padding:0;box-sizing:border-box}
button{font:inherit}
html,body{height:100vh;width:100vw;overflow:hidden;font-family:'Mali','Noto Sans Thai',sans-serif;background:var(--bg-0);color:var(--txt);user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,61,139,.08),transparent 50%),radial-gradient(circle at 80% 70%,rgba(77,208,255,.08),transparent 50%),radial-gradient(circle at 50% 50%,rgba(255,216,77,.04),transparent 60%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;height:100vh;width:100vw;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}

.topics-bar{display:flex;gap:6px;padding:8px 12px;background:linear-gradient(180deg,rgba(22,18,40,.95),rgba(16,12,30,.95));border-bottom:1px solid var(--line);backdrop-filter:blur(8px);align-items:center;overflow-x:auto;scrollbar-width:thin}
.topics-bar::-webkit-scrollbar{height:4px}
.topics-bar::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.brand{font-weight:800;font-size:14px;padding:6px 10px;background:linear-gradient(135deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.topic-btn{padding:5px 11px;background:rgba(42,36,85,.6);color:var(--muted);border:1px solid var(--line);border-radius:14px;cursor:pointer;font-size:11.5px;font-weight:500;transition:all .2s ease;white-space:nowrap}
.topic-btn:hover{background:rgba(60,50,120,.8);color:var(--txt)}
.topic-btn.active{background:linear-gradient(135deg,var(--pink),#c92d6e);color:#fff;border-color:var(--pink);box-shadow:0 0 12px rgba(255,61,139,.5)}
.topic-btn.done::after{content:' ✓';color:var(--green)}
.spacer{flex:1}
.stars-display{display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--yellow);white-space:nowrap}
.stars-display .star{font-size:14px}
.stars-display .star.empty{color:#444}
.settings-btn{background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:12px;cursor:pointer;font-size:12px}
.settings-btn:hover{color:var(--txt)}

.main{display:grid;grid-template-columns:1fr 230px;gap:12px;padding:12px;overflow:hidden;min-height:0}
.card{background:linear-gradient(135deg,rgba(31,26,58,.9),rgba(22,18,40,.95));border:1px solid var(--line);border-radius:18px;padding:24px 28px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--cyan),var(--yellow))}
.slide-content{flex:1;overflow-y:auto;padding-right:6px;scrollbar-width:thin}
.slide-content::-webkit-scrollbar{width:5px}
.slide-content::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

@keyframes slideEnter{0%{opacity:0;transform:translateX(40px) scale(.98);filter:blur(4px)}100%{opacity:1;transform:translateX(0) scale(1);filter:blur(0)}}
.slide-content>*{animation:slideEnter .5s cubic-bezier(.22,.61,.36,1) both}
.slide-content>*:nth-child(2){animation-delay:.08s}
.slide-content>*:nth-child(3){animation-delay:.16s}
.slide-content>*:nth-child(4){animation-delay:.24s}
.slide-content>*:nth-child(5){animation-delay:.32s}

.slide-header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.slide-num{font-size:11px;color:var(--muted);background:rgba(0,0,0,.3);padding:3px 8px;border-radius:8px;letter-spacing:1px;margin-left:auto}
.slide-title{font-size:21px;font-weight:700;color:var(--txt);line-height:1.2}
.slide-section-tag{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--pink);margin-bottom:4px}
.slide-body{font-size:14.5px;line-height:1.65;color:var(--txt)}
.slide-body p{margin-bottom:8px}
.lesson-visual{display:block;float:right;width:min(34%,320px);height:auto;max-height:240px;object-fit:contain;object-position:center;margin:0 0 12px 18px;border-radius:14px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.lesson-visual-small{width:min(24%,220px);max-height:170px}
.lesson-visual-centered{display:block;float:none;width:min(48%,420px);max-height:270px;margin:12px auto}
@media(max-width:880px){.lesson-visual{float:none;width:100%;margin:12px 0 0}.lesson-visual-centered{width:100%}}
.slide-body ul,.slide-body ol{margin:6px 0 10px 22px}
.slide-body li{margin-bottom:4px}
.slide-body code,.math{font-family:'JetBrains Mono','Consolas',monospace;background:rgba(255,61,139,.12);color:var(--pink-glow);padding:2px 7px;border-radius:5px;font-size:13.5px;border:1px solid rgba(255,61,139,.25)}
.example-box{margin:12px 0;padding:12px 14px;background:rgba(77,208,255,.06);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0}
.example-box .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--cyan);margin-bottom:5px;font-weight:700}
.tip-box{margin:12px 0;padding:10px 14px;background:rgba(255,216,77,.07);border-left:3px solid var(--yellow);border-radius:0 10px 10px 0;font-size:13.5px}
.tip-box .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--yellow);margin-bottom:4px;font-weight:700}

.side{display:grid;grid-template-rows:auto auto 1fr;gap:10px;min-height:0}
.hangman-box{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.hangman-box .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.hangman-count{color:var(--pink);font-weight:700}
.hangman-svg{width:100%;height:130px;background:rgba(0,0,0,.2);border-radius:8px}

.combo-box{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12px}
.combo-value{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.combo-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-top:4px}

.stats-box{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:11px}
.stats-box .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}

.quiz-question{font-size:17px;font-weight:600;margin-bottom:16px;line-height:1.5}
.quiz-options{display:grid;gap:9px}
.quiz-option{padding:12px 16px;background:rgba(42,36,85,.4);border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:all .2s ease;font-size:14.5px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.quiz-option:hover:not(.wrong):not(.correct):not(.disabled){background:rgba(60,50,120,.6);border-color:var(--cyan);transform:translateX(4px)}
.quiz-option .letter{width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.quiz-option.wrong{background:rgba(255,90,90,.12);border-color:var(--red);opacity:.55;cursor:not-allowed}
.quiz-option.wrong .letter{background:var(--red);color:#fff}
.quiz-option.wrong::after{content:'✗';margin-left:auto;color:var(--red);font-weight:700}
.quiz-option.correct{background:rgba(77,255,161,.12);border-color:var(--green)}
.quiz-option.correct .letter{background:var(--green);color:#052}
.quiz-option.correct::after{content:'✓';margin-left:auto;color:var(--green);font-weight:700;font-size:18px}
.quiz-option.disabled{cursor:not-allowed}
.quiz-feedback{margin-top:12px;padding:10px 14px;border-radius:9px;font-size:13.5px;display:none}
.quiz-feedback.show{display:block;animation:slideEnter .4s ease both}
.quiz-feedback.correct{background:rgba(77,255,161,.1);border:1px solid var(--green);color:var(--green)}
.quiz-feedback.wrong{background:rgba(255,90,90,.1);border:1px solid var(--red);color:var(--red)}

.bottom-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(0deg,rgba(22,18,40,.95),rgba(16,12,30,.95));border-top:1px solid var(--line);gap:12px}
.nav-btn{padding:8px 18px;background:linear-gradient(135deg,var(--pink),#c92d6e);color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:6px}
.nav-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,61,139,.4)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.secondary{background:rgba(42,36,85,.7);border:1px solid var(--line)}
.nav-btn.secondary:hover:not(:disabled){background:rgba(60,50,120,.8);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.progress-bar{flex:1;height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));width:0%;transition:width .4s ease;border-radius:3px}
.progress-text{font-size:11px;color:var(--muted);white-space:nowrap}

.combo-overlay{position:fixed;inset:0;pointer-events:none;z-index:100;display:none;align-items:center;justify-content:center}
.combo-overlay.show{display:flex}
.combo-text{font-size:110px;font-weight:900;color:var(--pink);text-shadow:0 0 8px #fff,0 0 16px var(--pink),0 0 30px var(--pink),0 0 50px var(--pink-glow),0 0 80px var(--pink-glow);animation:comboFlicker .35s infinite alternate,comboPop .6s ease;letter-spacing:4px;font-family:'Impact',sans-serif}
@keyframes comboFlicker{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;text-shadow:0 0 8px #fff,0 0 16px var(--pink),0 0 30px var(--pink),0 0 50px var(--pink-glow),0 0 80px var(--pink-glow)}20%,24%,55%{opacity:.4;text-shadow:none}}
@keyframes comboPop{0%{transform:scale(.3) rotate(-15deg);opacity:0}60%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
.combo-emoji{position:absolute;font-size:70px;top:30%;left:50%;transform:translate(-50%,-50%);animation:comboPop .6s ease}
.sparkle{position:absolute;width:8px;height:8px;border-radius:50%;animation:sparkleFloat 1s ease-out forwards}
@keyframes sparkleFloat{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:200;animation:fadeIn .3s ease}
.modal-backdrop.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(135deg,var(--bg-2),var(--bg-1));border:1px solid var(--pink);border-radius:20px;padding:28px;max-width:460px;text-align:center;box-shadow:0 0 60px rgba(255,61,139,.4);animation:modalIn .4s cubic-bezier(.22,.61,.36,1)}
@keyframes modalIn{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal h2{font-size:24px;margin-bottom:12px;color:var(--pink);text-shadow:0 0 12px var(--pink-glow)}
.modal p{color:var(--txt);margin-bottom:14px;line-height:1.6;font-size:14px}
.modal .stars-lost{font-size:32px;color:var(--yellow);margin:10px 0}
.modal.nt{border-color:var(--red);box-shadow:0 0 80px rgba(255,90,90,.6)}
.modal.nt h2{color:var(--red);text-shadow:0 0 16px var(--red);font-size:42px;letter-spacing:6px;animation:ntFlicker .4s infinite alternate}
@keyframes ntFlicker{from{text-shadow:0 0 16px var(--red);opacity:.85}to{text-shadow:0 0 30px var(--red),0 0 50px #ff8888;opacity:1}}
.modal .modal-btn{margin-top:8px}

.hangman-svg .part{opacity:0;transition:opacity .3s}
.hangman-svg .part.on{opacity:1;animation:draw .5s ease both}
@keyframes draw{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.hangman-svg .frame{stroke:var(--muted);stroke-width:2;fill:none}
.hangman-svg .body-part{stroke:var(--pink);stroke-width:2.5;fill:none;stroke-linecap:round}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}

@media(max-width:880px){.main{grid-template-columns:1fr}.side{display:none}.combo-text{font-size:70px}}
</style>
</head>
<body>
<div id="app">
  <div class="topics-bar" id="topicsBar">
    <span class="brand">⚡ Alge-Buddy</span>
    <div class="spacer"></div>
    <div class="stars-display" id="starsDisplay"></div>
    <button class="settings-btn" onclick="settings()">⚙</button>
  </div>
  <div class="main">
    <div class="card" id="card"></div>
    <div class="side">
      <div class="hangman-box">
        <div class="label"><span>Hangman</span><span class="hangman-count" id="hangmanCount">0/11</span></div>
        <svg class="hangman-svg" id="hangmanSvg" viewBox="0 0 120 160">
          <line class="frame" x1="10" y1="150" x2="90" y2="150"/>
          <line class="frame" x1="30" y1="150" x2="30" y2="10"/>
          <line class="frame" x1="30" y1="10" x2="80" y2="10"/>
          <line class="frame" x1="80" y1="10" x2="80" y2="25"/>
          <circle class="part body-part" id="p0" cx="80" cy="35" r="10"/>
          <line class="part body-part" id="p1" x1="80" y1="45" x2="80" y2="85"/>
          <line class="part body-part" id="p2" x1="80" y1="58" x2="65" y2="72"/>
          <line class="part body-part" id="p3" x1="80" y1="58" x2="95" y2="72"/>
          <line class="part body-part" id="p4" x1="80" y1="85" x2="68" y2="110"/>
          <line class="part body-part" id="p5" x1="80" y1="85" x2="92" y2="110"/>
          <path class="part body-part" id="p6" d="M70 28 Q80 16 90 28"/>
          <circle class="part body-part" id="p7" cx="76" cy="34" r="1.6" fill="#ff3d8b"/>
          <circle class="part body-part" id="p8" cx="84" cy="34" r="1.6" fill="#ff3d8b"/>
          <path class="part body-part" id="p9" d="M75 41 Q80 45 85 41"/>
          <path class="part body-part" id="p10" d="M70 48 L75 46 M85 46 L90 48" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="combo-box">
        <div class="combo-label">Combo Streak</div>
        <div class="combo-value" id="comboValue">0</div>
        <div class="combo-label" id="comboBest">Best: 0</div>
      </div>
      <div class="stats-box">
        <div class="label">Today</div>
        <div id="dailyStats" style="color:var(--muted);font-size:12px;line-height:1.6"></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn secondary" onclick="prev()">◀ Prev</button>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText">1 / 1</span>
    <button class="nav-btn" id="nextBtn" onclick="next()">Next ▶</button>
  </div>
</div>

<div class="combo-overlay" id="comboOverlay"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ============= SLIDE DATA =============
const slides = [];
let _id = 0;
const nextId = () => 's' + String(++_id).padStart(3,'0');

const L = (section, title, body, opts={}) => slides.push({
  id: nextId(), type:'lesson', section, title, body,
  example: opts.example || '', tip: opts.tip || ''
});

const Q = (section, title, question, options, answer, opts={}) => slides.push({
  id: nextId(), type:'quiz', section, title,
  question, options, answer,
  hint: opts.hint || '', explain: opts.explain || ''
});

// ===== SECTION 1: 10.0 Getting Started =====
L('10.0 Getting Started','Chapter 10: Manipulating Expressions',`
  <p>Welcome to <strong>Chapter 10</strong>! In this chapter, you will learn how to manipulate algebraic expressions.</p>
  <h3 style="color:var(--cyan);margin-top:12px;">You will learn how to:</h3>
  <ul>
    <li>Understand how to manipulate algebraic expressions, including:</li>
    <li style="margin-left:18px;">→ collecting like terms</li>
    <li style="margin-left:18px;">→ applying the distributive law with a constant</li>
  </ul>
`);

L('10.0 Getting Started','Starting Point — Algebra in Real Life',`
  <img class="lesson-visual" src="assets/01_number_machine.svg" alt="Number machine showing double a number, then add 5">
  <p><strong>Do you remember how to write an algebraic expression to represent something in real-life?</strong></p>
  <div class="example-box">
    <div class="label">Example</div>
    <p>You think of a number. You double the number and then add 5.</p>
    <p>You can write the new number as <span class="math">2m + 5</span>, where <span class="math">m</span> represents your original number.</p>
  </div>
`);

Q('10.0 Getting Started','Quick Check 1',
  'You think of a number <code>n</code>, then add 7. What is the new number?',
  ['n + 7','7n','n − 7','7 − n'], 0,
  {explain:'Adding 7 to n gives n + 7.'});

L('10.0 Getting Started','Starting Point — Multiply 2-Digit',`
  <img class="lesson-visual" src="assets/02_place_value_split.svg" alt="Place value split for multiplying a two-digit number">
  <p><strong>Do you remember how to multiply by 2-digit whole numbers?</strong></p>
  <div class="example-box">
    <div class="label">Example</div>
    <p>For example, <span class="math">3 × (42) = 3 × 40 + 3 × 2 = 120 + 6 = 126</span></p>
  </div>
  <p>This idea of "splitting then multiplying" is exactly what we will use when expanding brackets!</p>
`);

Q('10.0 Getting Started','Quick Check 2',
  'Using the same method, what is 4 × (23)?',
  ['4 × 20 + 4 × 3 = 92','4 × 20 + 3 = 83','4 + 20 + 3 = 27','4 × 23 = 423'], 0,
  {explain:'4 × 23 = 4 × 20 + 4 × 3 = 80 + 12 = 92.'});

L('10.0 Getting Started','This Will Help You...',`
  <p>This chapter will also be helpful when you learn about:</p>
  <ul><li>Constructing and using formulas</li><li>Solving equations</li><li>Working with patterns and sequences</li></ul>
  <div class="tip-box"><div class="label">Tip</div>Algebra is a tool — once you master it, you can describe many real-world situations concisely.</div>
`);

L('10.0 Getting Started','Eva\'s Cake Stall — Setup',`
  <img class="lesson-visual" src="assets/03_cupcake_stall.svg" alt="Cupcake stall with boxes of cakes">
  <p><strong>Eva is organising a charity cake stall.</strong></p>
  <p>She has <strong>five boxes</strong> of cupcakes with <span class="math">c</span> cakes in each box, plus another <strong>12 cupcakes</strong>.</p>
  <p style="margin-top:12px;">How could you write this as an algebraic expression?</p>
  <div class="tip-box"><div class="label">Think</div>5 boxes × c cakes + 12 more = ?</div>
`);

Q('10.0 Getting Started','Cake Stall Expression',
  'How many cupcakes does Eva have?',
  ['5c + 12','5 + c + 12','5(c + 12)','c + 60'], 0,
  {explain:'5 boxes of c cakes gives 5c, plus 12 separate cakes gives 5c + 12.'});

L('10.0 Getting Started','Eva Gets More Boxes',`
  <img class="lesson-visual lesson-visual-small" src="assets/03_cupcake_stall.svg" alt="Cupcake stall with boxes of cakes">
  <p>She is now given another <strong>eight boxes</strong> of cupcakes.</p>
  <p>How many cupcakes does she have now?</p>
  <div class="example-box">
    <div class="label">Reasoning</div>
    <p>Originally: <span class="math">5c + 12</span></p>
    <p>Added: <span class="math">8c</span> (8 more boxes of c)</p>
    <p>Total: <span class="math">5c + 12 + 8c = 13c + 12</span></p>
  </div>
`);

Q('10.0 Getting Started','Cake Stall New Total',
  'After getting 8 more boxes, how many cupcakes total?',
  ['13c + 12','5c + 8 + 12','13c + 8','40 + 12'], 0,
  {explain:'5c + 8c = 13c, plus the 12 = 13c + 12.'});

L('10.0 Getting Started','Eva Sells Some',`
  <img class="lesson-visual lesson-visual-small" src="assets/03_cupcake_stall.svg" alt="Cupcake stall with boxes of cakes">
  <p>She sells <strong>12 whole boxes</strong> of cupcakes and another <strong>seven separate cupcakes</strong>.</p>
  <p>How many cupcakes does she have left?</p>
  <div class="example-box">
    <div class="label">Reasoning</div>
    <p>Before: <span class="math">13c + 12</span></p>
    <p>Sold: <span class="math">12c + 7</span></p>
    <p>Left: <span class="math">13c + 12 − (12c + 7) = c + 5</span></p>
  </div>
`);

Q('10.0 Getting Started','Cake Stall After Selling',
  'After selling 12 boxes and 7 single cakes, what remains?',
  ['c + 5','c − 5','c + 12','25c + 5'], 0,
  {explain:'13c + 12 − 12c − 7 = (13c − 12c) + (12 − 7) = c + 5.'});

L('10.0 Getting Started','If 8 Cupcakes Per Box',`
  <p>If there were <strong>8 cupcakes in each box</strong>, how many cupcakes did she sell?</p>
  <div class="example-box">
    <div class="label">Reasoning</div>
    <p>Sold: <span class="math">12c + 7</span> with <span class="math">c = 8</span></p>
    <p>= <span class="math">12(8) + 7 = 96 + 7 = 103</span></p>
  </div>
`);

Q('10.0 Getting Started','Substitution Check',
  'If c = 8, how many cupcakes did she sell?',
  ['103','96','12','7'], 0,
  {explain:'12 × 8 + 7 = 96 + 7 = 103.'});

L('10.0 Getting Started','How Many Left?',`
  <p>With <span class="math">c = 8</span>, how many cupcakes did Eva have left?</p>
  <div class="example-box">
    <div class="label">Reasoning</div>
    <p>Left: <span class="math">c + 5 = 8 + 5 = 13</span></p>
  </div>
  <p style="margin-top:12px;">Notice how algebra lets us describe the situation first, then plug in numbers whenever we need them.</p>
`);

L('10.0 Getting Started','Make Your Own Problem',`
  <div class="tip-box">
    <div class="label">Try this!</div>
    Can you make up a problem like Eva's? Try this:
    <ol>
      <li>Pick a starting quantity (e.g., boxes of pens, packets of biscuits)</li>
      <li>Use a letter for the unknown amount in each</li>
      <li>Add or subtract a fixed amount</li>
      <li>Write the final expression</li>
    </ol>
  </div>
`);

// ===== SECTION 2: 10.1 Simplifying Expressions =====
L('10.1 Simplifying','Section 10.1 — Overview',`
  <p>In this section we will learn to <strong>simplify expressions</strong> by collecting like terms.</p>
  <p>This means combining terms that have the same letter (or letters) into a single, cleaner term.</p>
`);

L('10.1 Simplifying','Key Terms — Collecting Like Terms',`
  <img class="lesson-visual" src="assets/04_like_terms_tiles.svg" alt="Tiles showing matching like terms">
  <p>When more than one term with the <strong>same letter</strong> is added or subtracted, this is called:</p>
  <ul><li><strong>collecting like terms</strong>, or</li><li><strong>simplifying by collecting like terms</strong></li></ul>
`);

L('10.1 Simplifying','Rectangle Perimeter Example',`
  <img class="lesson-visual" src="assets/05_perimeter_shapes.svg" alt="Shapes illustrating perimeter">
  <p>A rectangle has side lengths <span class="math">c</span> and <span class="math">d</span>.</p>
  <p>The perimeter is:</p>
  <p style="text-align:center;font-size:18px;"><span class="math">c + d + c + d</span></p>
  <p>Since you have two lots of <span class="math">c</span> and two lots of <span class="math">d</span>, you can write this as:</p>
  <p style="text-align:center;font-size:22px;color:var(--pink);"><span class="math">2c + 2d</span></p>
`);

Q('10.1 Simplifying','Perimeter Check',
  'A rectangle has sides a and b. What is its perimeter simplified?',
  ['2a + 2b','a + b','ab + ab','2ab'], 0,
  {explain:'Perimeter = a + b + a + b = 2a + 2b.'});

L('10.1 Simplifying','Notation Rule — 2 × d = 2d',`
  <p>In algebra, <span class="math">2 × d</span> is written as <span class="math">2d</span>.</p>
  <p>This avoids confusing the multiplication sign with the letter <span class="math">x</span>.</p>
  <div class="tip-box"><div class="label">Rule</div>The number is always written before the letter: <span class="math">2d</span>, not <span class="math">d2</span>.</div>
`);

L('10.1 Simplifying','Tip — Alphabetical Order',`
  <div class="tip-box">
    <div class="label">Tip</div>
    If you have more than one letter in an expression, for example <span class="math">2c + 2d</span> or <span class="math">ab</span> (which means <span class="math">a × b</span>), write the letters in <strong>alphabetical order</strong>.
    <p style="margin-top:6px;">This makes the algebra easier to follow.</p>
  </div>
`);

L('10.1 Simplifying','Did You Know? — Origin of Algebra',`
  <p>The word <strong>"algebra"</strong> comes from the Arabic word <em>"al-jabr"</em>, which means "the reunion of broken parts".</p>
  <p>This word comes originally from the title of a book by the Persian mathematician and astronomer <strong>al-Khwarizmi</strong>, who lived in the 9th century.</p>
`);

Q('10.1 Simplifying','Origin Quiz',
  'The word "algebra" comes from which language?',
  ['Arabic','Greek','Latin','Persian'], 0,
  {explain:'It comes from the Arabic "al-jabr".'});

L('10.1 Simplifying','Worked Example 1 — Setup',`
  <p><strong>Worked Example 1</strong></p>
  <p>Form two expressions for the total mass of these five boxes:</p>
  <p>Three boxes have mass <span class="math">n grams</span>; two boxes have mass <span class="math">m grams</span>.</p>
`);

L('10.1 Simplifying','WE1a — Solution',`
  <p>There are 3 boxes of <span class="math">n</span> grams and 2 boxes of <span class="math">m</span> grams.</p>
  <p>So that is <span class="math">3 × n</span> and <span class="math">2 × m</span>.</p>
  <div class="example-box">
    <div class="label">Two valid expressions</div>
    <p><span class="math">(3n + 2m) grams</span></p>
    <p><span class="math">(2m + 3n) grams</span></p>
  </div>
`);

Q('10.1 Simplifying','WE1a Check',
  'For 3 boxes of n grams + 2 boxes of m grams, total is:',
  ['3n + 2m','5nm','3m + 2n','6mn'], 0,
  {explain:'3 × n + 2 × m = 3n + 2m. You can also swap order: 2m + 3n.'});

L('10.1 Simplifying','WE1a — Two Ways',`
  <p>Writing out the masses of the boxes you get:</p>
  <p style="text-align:center;"><span class="math">n + n + n + m + m = 3n + 2m</span></p>
  <p>As it is addition, you could swap the order:</p>
  <p style="text-align:center;"><span class="math">m + m + n + n + n = 2m + 3n</span></p>
  <p>Use brackets to show the whole amount is in grams:</p>
  <p style="text-align:center;color:var(--pink);"><span class="math">(3n + 2m) grams</span> or <span class="math">(2m + 3n) grams</span></p>
`);

L('10.1 Simplifying','WE1a — Tip: One Variable',`
  <div class="tip-box">
    <div class="label">Tip</div>
    Remember that when your answer is one of the variables, you just write the letter.
    <p>For example, if you have one <span class="math">g</span>, you write <span class="math">g</span>, not <span class="math">1g</span>.</p>
  </div>
`);

L('10.1 Simplifying','WE1b — Perimeter of Triangle',`
  <img class="lesson-visual" src="assets/05_perimeter_shapes.svg" alt="Shapes illustrating perimeter">
  <p><strong>Worked Example 1b</strong></p>
  <p>Form an expression for the perimeter of the triangle with sides:</p>
  <p style="text-align:center;"><span class="math">2c cm, 2c cm, d cm</span></p>
`);

L('10.1 Simplifying','WE1b — Solution',`
  <p>The perimeter is the sum of the sides:</p>
  <p style="text-align:center;font-size:18px;"><span class="math">2c + 2c + d</span></p>
  <p>This simplifies to:</p>
  <p style="text-align:center;font-size:22px;color:var(--pink);"><span class="math">4c + d</span></p>
  <p>So the perimeter is <span class="math">(4c + d) cm</span>.</p>
`);

Q('10.1 Simplifying','WE1b Check',
  'Triangle sides 2c, 2c, d. Perimeter?',
  ['4c + d','2c + d','4cd','c + d'], 0,
  {explain:'2c + 2c = 4c, plus d. The terms have different letters so cannot mix.'});

L('10.1 Simplifying','WE1b — Reasoning Detail',`
  <p>Write down the terms for the sides, then add together the terms in <span class="math">c</span>:</p>
  <p style="text-align:center;"><span class="math">2c + 2c + d = 4c + d</span></p>
  <div class="tip-box">
    <div class="label">Remember</div>
    The two terms have different letters, so you can't mix them together.
    Use brackets to show the whole perimeter is in centimetres.
  </div>
`);

L('10.1 Simplifying','WE1c — Simplify m + n + 3m + 2n − 2m',`
  <p><strong>Worked Example 1c</strong></p>
  <p>Simplify: <span class="math">m + n + 3m + 2n − 2m</span></p>
`);

L('10.1 Simplifying','WE1c — Solution',`
  <img class="lesson-visual" src="assets/04_like_terms_tiles.svg" alt="Tiles showing matching like terms">
  <p>Rearrange so that all the <span class="math">m</span> terms come first, then all the <span class="math">n</span> terms:</p>
  <p style="text-align:center;font-size:16px;"><span class="math">m + 3m − 2m + n + 2n</span></p>
  <p>Simplify the <span class="math">m</span> terms: <span class="math">m + 3m − 2m = 2m</span></p>
  <p>Simplify the <span class="math">n</span> terms: <span class="math">n + 2n = 3n</span></p>
  <p style="text-align:center;font-size:22px;color:var(--pink);"><span class="math">= 2m + 3n</span></p>
`);

Q('10.1 Simplifying','WE1c Check',
  'Simplify: m + n + 3m + 2n − 2m',
  ['2m + 3n','3m + 3n','4m + 3n','2m + 2n'], 0,
  {explain:'m + 3m − 2m = 2m, n + 2n = 3n.'});

L('10.1 Simplifying','WE1c — Sign Reminder',`
  <div class="tip-box">
    <div class="label">Tip</div>
    The sign in front of the term tells you whether you are adding or subtracting that term.
    <p>E.g., in <span class="math">... − 2m</span>, the <strong>−</strong> belongs to <span class="math">2m</span>.</p>
  </div>
`);

L('10.1 Simplifying','WE1d — Simplify 4 × 2z²',`
  <p><strong>Worked Example 1d</strong></p>
  <p>Simplify: <span class="math">4 × 2z²</span></p>
`);

L('10.1 Simplifying','WE1d — Solution',`
  <p>Remember that <span class="math">2z²</span> is the same as <span class="math">2 × z²</span>.</p>
  <p>So:</p>
  <p style="text-align:center;font-size:16px;"><span class="math">4 × 2 × z² = 8z²</span></p>
  <p style="text-align:center;font-size:22px;color:var(--pink);">Answer: <span class="math">8z²</span></p>
`);

Q('10.1 Simplifying','WE1d Check',
  'Simplify: 5 × 3a²',
  ['15a²','8a²','15a','5a × 3'], 0,
  {explain:'5 × 3 × a² = 15a².'});

L('10.1 Simplifying','WE1e — Simplify 3b + b/2',`
  <p><strong>Worked Example 1e</strong></p>
  <p>Simplify: <span class="math">3b + b/2</span></p>
`);

L('10.1 Simplifying','WE1e — Solution',`
  <img class="lesson-visual" src="assets/06_fraction_bars.svg" alt="Fraction bars showing halves">
  <p>In 3 whole <span class="math">b</span>s there are <strong>6 half <span class="math">b</span>s</strong>.</p>
  <p>6 half <span class="math">b</span>s plus another half <span class="math">b</span> makes <strong>7 half <span class="math">b</span>s</strong>.</p>
  <p style="text-align:center;font-size:16px;"><span class="math">3b + b/2 = (6b + b)/2 = 7b/2 = 3½b</span></p>
`);

Q('10.1 Simplifying','WE1e Check',
  'Simplify: 2a + a/3',
  ['7a/3','2a/3','3a/3','a'], 0,
  {explain:'2a = 6a/3, plus a/3 = 7a/3.'});

L('10.1 Simplifying','Exercise 1.1 — Like Terms (a–d)',`
  <p><strong>Exercise 1, Q1 (a–d): Simplify by collecting like terms</strong></p>
  <ol type="a">
    <li><span class="math">m + 3m + m</span> → <strong>5m</strong></li>
    <li><span class="math">2b + 5b + b</span> → <strong>8b</strong></li>
    <li><span class="math">y + 3y + 2y + y</span> → <strong>7y</strong></li>
    <li><span class="math">4g + 7g + 5g</span> → <strong>16g</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.1 Practice',
  'Simplify: 4g + 7g + 5g',
  ['16g','12g','15g','11g'], 0,
  {explain:'4 + 7 + 5 = 16, all like terms of g.'});

L('10.1 Simplifying','Exercise 1.1 — Like Terms (e–h)',`
  <p><strong>Exercise 1, Q1 (e–h):</strong></p>
  <ol type="a" start="5">
    <li><span class="math">5e − 3e</span> → <strong>2e</strong></li>
    <li><span class="math">6m − 5m</span> → <strong>m</strong> (not 1m!)</li>
    <li><span class="math">15k − 6k</span> → <strong>9k</strong></li>
    <li><span class="math">5d − d</span> → <strong>4d</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.1 (e–h)',
  'Simplify: 15k − 6k',
  ['9k','21k','k','15'], 0,
  {explain:'15 − 6 = 9, k stays.'});

L('10.1 Simplifying','Exercise 1.1 — Like Terms (i–l)',`
  <p><strong>Exercise 1, Q1 (i–l):</strong></p>
  <ol type="a" start="9">
    <li><span class="math">9a + a − 2a</span> → <strong>8a</strong></li>
    <li><span class="math">3p − 4p + 5p</span> → <strong>4p</strong></li>
    <li><span class="math">6h + 5h − 10h</span> → <strong>h</strong></li>
    <li><span class="math">2x + x − 3x</span> → <strong>0</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.1 (i–l)',
  'Simplify: 3p − 4p + 5p',
  ['4p','2p','6p','12p'], 0,
  {explain:'3 − 4 + 5 = 4, so 4p.'});

L('10.1 Simplifying','Exercise 1.2 — Triangle Perimeters (a–b)',`
  <p><strong>Exercise 1, Q2 (a–b): Perimeter of each triangle</strong></p>
  <ol type="a">
    <li>sides: <span class="math">a, a, a</span> → <strong>3a cm</strong></li>
    <li>sides: <span class="math">x, 2x, x</span> → <strong>4x cm</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.2 (a–b)',
  'Triangle sides: x, 2x, x. Perimeter?',
  ['4x','3x','2x','4x²'], 0,
  {explain:'x + 2x + x = 4x.'});

L('10.1 Simplifying','Exercise 1.2 — Triangle Perimeters (c–d)',`
  <p><strong>Exercise 1, Q2 (c–d):</strong></p>
  <ol type="a" start="3">
    <li>sides: <span class="math">d, 2d, 2d</span> → <strong>5d cm</strong></li>
    <li>sides: <span class="math">f, 3f, 3f</span> → <strong>7f cm</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.2 (c–d)',
  'Triangle sides: d, 2d, 2d. Perimeter?',
  ['5d','4d','6d','d'], 0,
  {explain:'d + 2d + 2d = 5d.'});

L('10.1 Simplifying','Exercise 1.3 — Mixed Terms (a–d)',`
  <p><strong>Exercise 1, Q3 (a–d): Simplify by collecting like terms</strong></p>
  <ol type="a">
    <li><span class="math">a + b + a</span> → <strong>2a + b</strong></li>
    <li><span class="math">2x + y + y</span> → <strong>2x + 2y</strong></li>
    <li><span class="math">m + n + n + m</span> → <strong>2m + 2n</strong></li>
    <li><span class="math">3d + e − e</span> → <strong>3d</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.3 (a–d)',
  'Simplify: m + n + n + m',
  ['2m + 2n','mn + mn','2mn','m + 2n'], 0,
  {explain:'m + m = 2m, n + n = 2n.'});

L('10.1 Simplifying','Exercise 1.3 — Mixed Terms (e–h)',`
  <p><strong>Exercise 1, Q3 (e–h):</strong></p>
  <ol type="a" start="5">
    <li><span class="math">3y + 2x + 2y</span> → <strong>5y + 2x</strong></li>
    <li><span class="math">3f − f + 4g + 2g</span> → <strong>2f + 6g</strong></li>
    <li><span class="math">k + 4c + 2k − k</span> → <strong>2k + 4c</strong></li>
    <li><span class="math">3v + 2w + 5w − v</span> → <strong>2v + 7w</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.3 (e–h)',
  'Simplify: 3f − f + 4g + 2g',
  ['2f + 6g','2f + 2g','4fg','6fg'], 0,
  {explain:'3f − f = 2f, 4g + 2g = 6g.'});

L('10.1 Simplifying','Exercise 1.4 — Perimeters of Shapes (a–c)',`
  <p><strong>Exercise 1, Q4 (a–c):</strong></p>
  <ol type="a">
    <li>triangle: <span class="math">2b, f, 3b</span> → <strong>5b + f</strong></li>
    <li>triangle: <span class="math">4g, 5k, 2k</span> → <strong>4g + 7k</strong></li>
    <li>rectangle: <span class="math">3f, 2m, 3f, 2m</span> → <strong>6f + 4m</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.4 (a–c)',
  'Rectangle sides: 3f, 2m, 3f, 2m. Perimeter?',
  ['6f + 4m','5fm','6f + 2m','12fm'], 0,
  {explain:'3f + 3f = 6f, 2m + 2m = 4m.'});

L('10.1 Simplifying','Exercise 1.4 — Perimeters (d–f)',`
  <p><strong>Exercise 1, Q4 (d–f):</strong></p>
  <ol type="a" start="4">
    <li>kite: <span class="math">a, a, 4d, 4d</span> → <strong>2a + 8d</strong></li>
    <li>parallelogram: <span class="math">5y, 3x, 5y, 3x</span> → <strong>10y + 6x</strong></li>
    <li>quad: <span class="math">3b, 5a, 3a, 2a</span> → <strong>10a + 3b</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.4 (d–f)',
  'Parallelogram sides: 5y, 3x, 5y, 3x. Perimeter?',
  ['10y + 6x','15xy','8xy','5y + 3x'], 0,
  {explain:'5y × 2 = 10y, 3x × 2 = 6x.'});

L('10.1 Simplifying','Exercise 1.5 — Numbers + Letters (a–d)',`
  <p><strong>Exercise 1, Q5 (a–d): Simplify</strong></p>
  <ol type="a">
    <li><span class="math">5n + 4 − 3n + 1 + 2n</span> → <strong>4n + 5</strong></li>
    <li><span class="math">4a − 3b + 6a − 5b</span> → <strong>10a − 8b</strong></li>
    <li><span class="math">7u − 2 + u + 11 − 3u</span> → <strong>5u + 9</strong></li>
    <li><span class="math">8t + 2 − 5t − 12</span> → <strong>3t − 10</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.5 (a–d)',
  'Simplify: 5n + 4 − 3n + 1 + 2n',
  ['4n + 5','4n + 4','10n + 5','5n + 5'], 0,
  {explain:'5n − 3n + 2n = 4n, 4 + 1 = 5.'});

L('10.1 Simplifying','Exercise 1.5 — (e–h)',`
  <p><strong>Exercise 1, Q5 (e–h):</strong></p>
  <ol type="a" start="5">
    <li><span class="math">e + 4f + 3e − 2f − 6f</span> → <strong>4e − 4f</strong></li>
    <li><span class="math">6g − 3h − 2g + 4h + 2</span> → <strong>4g + h + 2</strong></li>
    <li><span class="math">9 + 4u − 4 − 7u + 3</span> → <strong>8 − 3u</strong></li>
    <li><span class="math">3 − 2r + q + 4 − 5r − 7q</span> → <strong>7 − 7r − 6q</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.5 (e–h)',
  'Simplify: 6g − 3h − 2g + 4h + 2',
  ['4g + h + 2','4g + h','4g + 7h','8g + 2'], 0,
  {explain:'6g − 2g = 4g, −3h + 4h = h, +2.'});

L('10.1 Simplifying','Exercise 1.5 — (i–l)',`
  <p><strong>Exercise 1, Q5 (i–l):</strong></p>
  <ol type="a" start="9">
    <li><span class="math">8c − 13 + 4d − 6c + d − 2 − 2c</span> → <strong>5d − 15</strong></li>
    <li><span class="math">6a − 4b + 7c − b − 2c − 11a</span> → <strong>5c − 5a − 5b</strong></li>
    <li><span class="math">9a² − 3a + a² + 2a + 3</span> → <strong>10a² − a + 3</strong></li>
    <li><span class="math">4r − 9 − 6r² + 4 + 2r² − r</span> → <strong>−4r² + 3r − 5</strong></li>
  </ol>
`);

Q('10.1 Simplifying','Ex 1.5 (i–l)',
  'Simplify: 9a² − 3a + a² + 2a + 3',

  {explain:'9a² + a² = 10a², −3a + 2a = −a, +3.'});

L('10.1 Simplifying','Exercise 1.6 — Multiplying Terms (a–d)',`
  <p><strong>Exercise 1, Q6 (a–d): Simplify</strong></p>
  <ol type="a">
    <li><span class="math">3 × a</span> → <strong>3a</strong></li>
    <li><span class="math">4 × 2c</span> → <strong>8c</strong></li>

Q('10.1 Simplifying','Ex 1.6 (a–d)',

L('10.1 Simplifying','Exercise 1.6 — (e–h)',`
  <p><strong>Exercise 1, Q6 (e–h):</strong></p>
  <ol type="a" start="5">
    <li><span class="math">3 × c × c</span> → <strong>3c²</strong></li>
    <li><span class="math">c × d × c</span> → <strong>c²d</strong></li>

`);

Q('10.1 Simplifying','Ex 1.6 (e–h)',

L('10.1 Simplifying','Exercise 1.7 — Matching (Intro)',`
  <p><strong>Exercise 1, Q7: Match expressions</strong></p>
  <p>Match each expression in column 1 with one from column 2.</p>
  <div class="example-box">
    <div class="label">First column</div>
    <ol>
      <li><span class="math">a² + 2a² + b + b</span></li>
      <li><span class="math">a² + 3a² − 2a²</span></li>
      <li><span class="math">2ab − a + 3ab + 2b</span></li>

L('10.1 Simplifying','Pyramid 4',`

`);

// ===== SECTION 3: 10.2 Distributive Law =====
L('10.2 Distributive','Section 10.2 — Overview',`
  <p>In this section, you'll learn to <strong>multiply a constant over a bracket</strong>.</p>
  <p>This is also called <strong>expanding</strong> or <strong>multiplying out</strong> the bracket.</p>
`);

L('10.2 Distributive','Key Terms — Expanding Brackets',`
  <img class="lesson-visual" src="assets/08_bracket_distribution.svg" alt="Diagram showing distribution across brackets">
  <p>Multiplying a constant over a bracket means removing the brackets from expressions.</p>
  <div class="example-box">
    <div class="label">Example</div>
    <p><span class="math">3(6 + w)</span> means 3 lots of 6 plus 3 lots of <span class="math">w</span>.</p>
    <p><span class="math">6 + w + 6 + w + 6 + w = 18 + 3w</span></p>
    <p>So: <span class="math">3(6 + w) = 18 + 3w</span></p>
  </div>
`);

Q('10.2 Distributive','Expand Check',
  'Expand: 3(6 + w)',
  ['18 + 3w','9 + 3w','18 + w','3w + 6'], 0,
  {explain:'3 × 6 = 18, 3 × w = 3w.'});

L('10.2 Distributive','More Expansion Examples',`
  <p>Both the 6 and the <span class="math">w</span> have been multiplied by 3 — everything inside the brackets is multiplied by the number outside.</p>
  <p>In the same way:</p>
  <p style="text-align:center;"><span class="math">4(r + 8) = 4r + 32</span></p>
  <p style="text-align:center;"><span class="math">5(7 − t) = 35 − 5t</span></p>
`);

Q('10.2 Distributive','Expand More',
  'Expand: 4(r + 8)',
  ['4r + 32','4r + 8','r + 32','4r + 12'], 0,
  {explain:'4 × r = 4r, 4 × 8 = 32.'});

L('10.2 Distributive','Tip — Every Term!',`
  <img class="lesson-visual" src="assets/08_bracket_distribution.svg" alt="Diagram showing distribution across brackets">
  <div class="tip-box">
    <div class="label">Tip</div>
    Make sure you multiply <strong>every term</strong> inside the brackets by the number outside the brackets.
    <p>Common mistake: <span class="math">3(a + 4) ≠ 3a + 4</span>. The 4 must also be multiplied!</p>
  </div>
`);

Q('10.2 Distributive','Common Mistake',
  'Expand: 3(a + 4)',
  ['3a + 12','3a + 4','a + 12','7a'], 0,
  {explain:'3 × a = 3a, 3 × 4 = 12.'});

L('10.2 Distributive','Worked Example 2 — Setup',`

  <p><strong>Worked Example 2</strong></p>
  <ul>
    <li>Jack spends <span class="math">2m</span> minutes on his homework.</li>
    <li>Peter spends 3 minutes more on his homework than Jack.</li>
    <li>Daniel spends twice as much time on his homework as Peter.</li>
  </ul>
  <p>Form expressions for the amount of time (in minutes) that Peter and Daniel spend.</p>
`);

L('10.2 Distributive','WE2a — Peter',`
  <p><strong>Part a) Peter</strong></p>
  <p>Jack spends <span class="math">2m</span> minutes. Peter spends 3 minutes more.</p>
  <div class="example-box">
    <div class="label">Answer</div>
    Peter spends <span class="math">(2m + 3)</span> minutes on his homework.
  </div>
`);

Q('10.2 Distributive','WE2a Check',

L('10.2 Distributive','WE2b — Daniel',`
  <img class="lesson-visual" src="assets/09_homework_story.svg" alt="Homework time story for Jack, Peter, and Daniel">
  <p><strong>Part b) Daniel</strong></p>
  <p>Daniel spends twice as much time as Peter.</p>

L('10.2 Distributive','WE2b — Multiply Out',`
  <p>Multiply out:</p>
  <p style="text-align:center;font-size:18px;"><span class="math">2(2m + 3) = 4m + 6</span></p>
  <p>Every term in the brackets is multiplied by the number outside the brackets.</p>
  <p style="color:var(--pink);">So Daniel spends <span class="math">(4m + 6)</span> minutes.</p>

  <p><span class="math">2(3a + 3) = 6a + 3</span></p>
  <p>Perimeter = <span class="math">3(2a + 1) cm</span></p>

  <p>Is Jane correct? <strong>No.</strong></p>
  <div class="example-box">

  </div>
  <p>Jane made a mistake: <span class="math">2(3a + 3)</span> should be <span class="math">6a + 6</span>, not <span class="math">6a + 3</span>.</p>
`);

// ===== SECTION 4: Consolidation & Reflection =====
L('Consolidation','Consolidation 1 — True or False (a–c)',`
  <p><strong>Consolidation Exercise, Q1 (a–c): True or false?</strong></p>
  <ol type="a">
    <li><span class="math">4c</span> means <span class="math">4 × c</span> → <strong>True</strong></li>
    <li><span class="math">t + t + t + t + t + t = 6t</span> → <strong>True</strong></li>
    <li><span class="math">d + d − d − d = d</span> → <strong>False</strong> (it equals 0)</li>
  </ol>

// ============= GAME LOGIC =============
const C = { stars: 5, maxWrong: 11, key: 'alge-buddy-manip-v1' };

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function fresh() {
  return {
    permanent: {
      lastSlide: 's001', correctQuizIds: [], completedSlides: [],
      wrongChoices: {}, weakTopics: {}, hangmanParts: 0, hangmanPending: false,
      soundOn: false, comboStreak: 0, bestCombo: 0
    },
    daily: { date: today(), stars: C.stars, correctToday: 0, attempted: [] }
  };
}

let state = fresh();
let audioContext = null;

function save() {
  try { localStorage.setItem(C.key, JSON.stringify(state)); }
  catch (e) { /* Continue working if browser storage is blocked or full. */ }
}

function read() {
  let s;
  try {
    s = JSON.parse(localStorage.getItem(C.key));
  } catch (e) { return fresh(); }
  if (!s || !s.permanent || !s.daily) return fresh();

  if (s.daily.date !== today()) {
    s.daily = { date: today(), stars: C.stars, correctToday: 0, attempted: [] };
  }

  s.permanent.correctQuizIds = Array.isArray(s.permanent.correctQuizIds) ? s.permanent.correctQuizIds : [];
  s.permanent.completedSlides = Array.isArray(s.permanent.completedSlides) ? s.permanent.completedSlides : [];
  s.permanent.wrongChoices = s.permanent.wrongChoices && typeof s.permanent.wrongChoices === 'object' ? s.permanent.wrongChoices : {};
  s.permanent.weakTopics = s.permanent.weakTopics && typeof s.permanent.weakTopics === 'object' ? s.permanent.weakTopics : {};
  s.permanent.hangmanParts = Math.max(0, Math.min(C.maxWrong, Number(s.permanent.hangmanParts) || 0));
  s.permanent.hangmanPending = Boolean(s.permanent.hangmanPending);
  s.permanent.soundOn = Boolean(s.permanent.soundOn);
  s.permanent.comboStreak = Math.max(0, Number(s.permanent.comboStreak) || 0);
  s.permanent.bestCombo = Math.max(s.permanent.comboStreak, Number(s.permanent.bestCombo) || 0);
  s.daily.stars = Math.max(0, Math.min(C.stars, Number(s.daily.stars) || 0));
  s.daily.correctToday = Math.max(0, Number(s.daily.correctToday) || 0);
  s.daily.attempted = Array.isArray(s.daily.attempted) ? s.daily.attempted : [];
  return s;
}

function playSound(kind) {
  if (!state.permanent.soundOn) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  audioContext ||= new Audio();
  if (audioContext.state === 'suspended') audioContext.resume();
  const now = audioContext.currentTime;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.type = kind === 'correct' ? 'sine' : 'triangle';
  oscillator.frequency.setValueAtTime(kind === 'correct' ? 660 : 180, now);
  oscillator.frequency.exponentialRampToValueAtTime(kind === 'correct' ? 880 : 90, now + .2);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.exponentialRampToValueAtTime(.06, now + .02);
  gain.gain.exponentialRampToValueAtTime(.0001, now + .25);
  oscillator.connect(gain).connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now + .27);
}

let currentIndex = 0;
const D = {
  slides, total: slides.length,
  sections: [...new Set(slides.map(s => s.section))]
};

function go(i) {
  const n = Math.max(0, Math.min(D.total - 1, i));
  currentIndex = n;
  state.permanent.lastSlide = D.slides[n].id;
  save();
  render();
}

function next() {
  const s = D.slides[currentIndex];
  if (s.type === 'quiz' && !state.permanent.correctQuizIds.includes(s.id)) {
    shakeCard();
    return;
  }
  if (currentIndex < D.total - 1) go(currentIndex + 1);
  else summary();
}

function prev() { if (currentIndex > 0) go(currentIndex - 1); }

function shakeCard() {
  const card = document.getElementById('card');
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 400);
}

function answer(i) {
  const s = D.slides[currentIndex];
  if (s.type !== 'quiz') return;
  if (state.permanent.hangmanPending) return;
  if (state.permanent.correctQuizIds.includes(s.id)) return;
  if ((state.permanent.wrongChoices[s.id] || []).includes(i)) return;

  if (i === s.answer) {
    state.permanent.correctQuizIds.push(s.id);
    state.daily.correctToday++;
    if (!state.daily.attempted.includes(s.id)) state.daily.attempted.push(s.id);
    state.permanent.comboStreak++;
    state.permanent.bestCombo = Math.max(state.permanent.bestCombo, state.permanent.comboStreak);
    playSound('correct');
    showCombo(state.permanent.comboStreak);
    save();
    render();
  } else {
    (state.permanent.wrongChoices[s.id] ||= []).push(i);
    state.permanent.hangmanParts++;
    state.permanent.weakTopics[s.section] = (state.permanent.weakTopics[s.section] || 0) + 1;
    state.permanent.comboStreak = 0;
    playSound('wrong');

    if (state.permanent.hangmanParts >= C.maxWrong) {
      state.permanent.hangmanParts = C.maxWrong;
      state.permanent.hangmanPending = true;
      state.daily.stars = Math.max(0, state.daily.stars - 1);

      if (state.daily.stars === 0) {
        save();
        render();
        setTimeout(() => openNT(), 400);
        return;
      }
      save();
      render();
      setTimeout(() => openHangman(), 400);
      return;
    }
    save();
    render();
  }
}

function showCombo(n) {
  const overlay = document.getElementById('comboOverlay');
  overlay.innerHTML = '';
  const emojis = ['🔥','⭐','💥','✨','🎉','⚡','🌟','💫'];
  const colors = ['#ff3d8b','#4dd0ff','#ffd84d','#4dffa1'];

  const textEl = document.createElement('div');
  textEl.className = 'combo-text';
  textEl.textContent = `COMBO ×${n}!`;
  overlay.appendChild(textEl);

  const emojiEl = document.createElement('div');
  emojiEl.className = 'combo-emoji';
  emojiEl.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  overlay.appendChild(emojiEl);

  for (let i = 0; i < 24; i++) {
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    const angle = (Math.PI * 2 * i) / 24 + Math.random() * 0.5;
    const distance = 120 + Math.random() * 180;
    sparkle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
    sparkle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
    sparkle.style.left = '50%';
    sparkle.style.top = '50%';
    const color = colors[i % colors.length];
    sparkle.style.background = color;
    sparkle.style.boxShadow = `0 0 10px ${color}`;
    overlay.appendChild(sparkle);
  }

  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 1500);
}

function openHangman() {
  const modal = document.getElementById('modalContent');
  modal.className = 'modal';
  const lost = C.stars - state.daily.stars;
  let starHtml = '';
  for (let i = 0; i < C.stars; i++) {
    starHtml += i < state.daily.stars ? '★' : '☆';
  }
  modal.innerHTML = `
    <h2>💀 Hangman Complete!</h2>
    <p>You've made 11 mistakes. A star has been lost.</p>
    <div class="stars-lost">${starHtml}</div>
    <p style="font-size:13px;color:var(--muted);">Stars remaining: ${state.daily.stars}/${C.stars}</p>
    <p>Click below to start a fresh Hangman set. Your wrong choices are remembered.</p>
    <button class="nav-btn modal-btn" onclick="resetHangman()">Start New Hangman</button>
  `;
  document.getElementById('modalBackdrop').classList.add('show');
}

function resetHangman() {
  state.permanent.hangmanParts = 0;
  state.permanent.hangmanPending = false;
  save();
  closeModal();
  render();
}

function openNT() {
  const modal = document.getElementById('modalContent');
  modal.className = 'modal nt';
  modal.innerHTML = `
    <h2>NT!</h2>
    <p style="font-size:16px;">You've lost all your stars for today.</p>
    <p>The system will reset everything so you can start fresh.</p>
    <button class="nav-btn modal-btn" onclick="fullReset()" style="background:linear-gradient(135deg,var(--red),#c93434);">Reset & Restart</button>
  `;
  document.getElementById('modalBackdrop').classList.add('show');
}

function fullReset() {
  state = fresh();
  save();
  currentIndex = 0;
  closeModal();
  render();
}

function closeModal() { document.getElementById('modalBackdrop').classList.remove('show'); }

function render() {
  state = read();
  const s = D.slides[currentIndex];

  if (!state.permanent.completedSlides.includes(s.id)) {
    state.permanent.completedSlides.push(s.id);
    save();
  }

  const card = document.getElementById('card');
  if (s.type === 'quiz') card.innerHTML = quizHtml(s);
  else card.innerHTML = lessonHtml(s);

  renderStars();
  renderTopics();
  renderHangman();
  renderCombo();
  renderProgress();

  if (state.permanent.hangmanPending && s.type === 'quiz') {
    setTimeout(openHangman, 80);
  }
}

function lessonHtml(s) {
  return `
    <div class="slide-content">
      <div class="slide-header">
        <div>
          <div class="slide-section-tag">${s.section}</div>
          <div class="slide-title">${s.title}</div>
        </div>
        <div class="slide-num">${s.id.toUpperCase()}</div>
      </div>
      <div class="slide-body">
        ${s.body}
        ${s.example ? `<div class="example-box"><div class="label">Example</div>${s.example}</div>` : ''}
        ${s.tip ? `<div class="tip-box"><div class="label">Tip</div>${s.tip}</div>` : ''}
      </div>
    </div>
  `;
}

function quizHtml(s) {
  const correct = state.permanent.correctQuizIds.includes(s.id);
  const wrongs = state.permanent.wrongChoices[s.id] || [];
  return `
    <div class="slide-content">
      <div class="slide-header">
        <div>
          <div class="slide-section-tag">${s.section} · QUIZ</div>
          <div class="slide-title">${s.title}</div>
        </div>
        <div class="slide-num">${s.id.toUpperCase()}</div>
      </div>
      <div class="slide-body">
        <div class="quiz-question">${s.question}</div>
        <div class="quiz-options">
          ${s.options.map((opt, i) => {
            let cls = 'quiz-option';
            if (correct && i === s.answer) cls += ' correct';
            else if (wrongs.includes(i)) cls += ' wrong';
            else if (correct) cls += ' disabled';
            return `<div class="${cls}" onclick="answer(${i})"><div class="letter">${String.fromCharCode(65 + i)}</div><div>${opt}</div></div>`;
          }).join('')}
        </div>
        ${correct ? `<div class="quiz-feedback correct show">✓ Correct! ${s.explain || ''}</div>` : ''}
        ${wrongs.length > 0 && !correct ? `<div class="quiz-feedback wrong show">✗ Not quite. Try again!${s.hint ? `<br><em>Hint:</em> ${s.hint}` : ''}</div>` : ''}
      </div>
    </div>
  `;
}

function renderStars() {
  const n = state.daily.stars;
  const el = document.getElementById('starsDisplay');
  let html = '';
  for (let i = 0; i < C.stars; i++) {
    html += `<span class="star${i >= n ? ' empty' : ''}">${i < n ? '★' : '☆'}</span>`;
  }
  html += `<span style="margin-left:6px;font-size:11px;">${n}/${C.stars}</span>`;
  el.innerHTML = html;
}

function renderTopics() {
  const bar = document.getElementById('topicsBar');
  bar.querySelectorAll('.topic-btn').forEach(b => b.remove());
  const spacer = bar.querySelector('.spacer');
  D.sections.forEach((sec) => {
    const first = D.slides.findIndex(s => s.section === sec);
    const last = D.slides.length - 1 - [...D.slides].reverse().findIndex(s => s.section === sec);
    const sectionSlides = D.slides.slice(first, last + 1);
    const allDone = sectionSlides.every(s => s.type !== 'quiz' || state.permanent.correctQuizIds.includes(s.id));
    const isActive = D.slides[currentIndex].section === sec;
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (isActive ? ' active' : '') + (allDone ? ' done' : '');
    btn.textContent = sec;
    btn.onclick = () => go(first);
    bar.insertBefore(btn, spacer);
  });
}

function renderHangman() {
  const n = state.permanent.hangmanParts;
  document.getElementById('hangmanCount').textContent = `${n}/${C.maxWrong}`;
  for (let i = 0; i < C.maxWrong; i++) {
    const el = document.getElementById('p' + i);
    if (el) {
      if (i < n) el.classList.add('on');
      else el.classList.remove('on');
    }
  }
}

function renderCombo() {
  document.getElementById('comboValue').textContent = state.permanent.comboStreak;
  document.getElementById('comboBest').textContent = `Best: ${state.permanent.bestCombo}`;
  document.getElementById('dailyStats').innerHTML = `
    Correct today: <strong style="color:var(--green)">${state.daily.correctToday}</strong><br>
    Quiz done: <strong style="color:var(--cyan)">${state.permanent.correctQuizIds.length}</strong>/${D.slides.filter(s => s.type==='quiz').length}<br>
    Slides seen: <strong style="color:var(--yellow)">${state.permanent.completedSlides.length}</strong>
  `;
}

function renderProgress() {
  const pct = ((currentIndex + 1) / D.total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = (currentIndex + 1) + ' / ' + D.total;
  const s = D.slides[currentIndex];
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.disabled = (s.type === 'quiz' && !state.permanent.correctQuizIds.includes(s.id));
}

function settings() {
  const weak = Object.entries(state.permanent.weakTopics || {})
    .sort((a, b) => b[1] - a[1]).slice(0, 3);
  const modal = document.getElementById('modalContent');
  modal.className = 'modal';
  modal.innerHTML = `
    <h2>⚙ Settings</h2>
    <p style="text-align:left;"><strong>Sound:</strong> ${state.permanent.soundOn ? 'ON 🔊' : 'OFF 🔇'}</p>
    <button class="nav-btn secondary modal-btn" onclick="toggleSound()">Toggle Sound</button>
    <p style="text-align:left;margin-top:14px;"><strong>Topics to review:</strong></p>
    ${weak.length === 0 ? '<p>No weak topics yet. Keep going!</p>' :
      `<ul style="text-align:left;padding-left:20px;">${weak.map(([t, c]) => `<li style="margin-bottom:4px;">${t}: <strong style="color:var(--red)">${c}</strong> mistakes</li>`).join('')}</ul>`}
    <p style="text-align:left;margin-top:10px;"><strong>Best combo:</strong> <span style="color:var(--pink);font-size:18px;">${state.permanent.bestCombo}</span></p>
    <p style="text-align:left;"><strong>Quiz completed:</strong> ${state.permanent.correctQuizIds.length}</p>
    <button class="nav-btn modal-btn" style="background:linear-gradient(135deg,var(--red),#c93434);" onclick="restartLesson()">Restart Lesson</button>
    <button class="nav-btn secondary modal-btn" onclick="closeModal()">Close</button>
  `;
  document.getElementById('modalBackdrop').classList.add('show');
}

function toggleSound() {
  state.permanent.soundOn = !state.permanent.soundOn;
  save();
  settings();
}

function restartLesson() {
  state = fresh();
  save();
  currentIndex = 0;
  closeModal();
  render();
}

function summary() {
  const modal = document.getElementById('modalContent');
  modal.className = 'modal';
  modal.innerHTML = `
    <h2>🎉 Lesson Complete!</h2>
    <p>You've finished all ${D.total} slides.</p>
    <p>Quiz correct: <strong style="color:var(--green)">${state.permanent.correctQuizIds.length}</strong></p>
    <p>Best combo: <strong style="color:var(--pink)">${state.permanent.bestCombo}</strong></p>
    <button class="nav-btn modal-btn" onclick="closeModal()">Close</button>
  `;
  document.getElementById('modalBackdrop').classList.add('show');
}

// ============= INITIALIZE APP =============
// Load saved progress first, then render the last valid slide.
state = read();
const savedIndex = slides.findIndex(s => s.id === state.permanent.lastSlide);
currentIndex = savedIndex >= 0 ? savedIndex : 0;
render();

</script>
</body>
</html>
