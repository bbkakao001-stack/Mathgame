<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alge-Buddy · Manipulating Expressions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#0a0814; --bg-1:#161228; --bg-2:#1f1a3a; --panel:#1a1530;
  --line:#2a2455; --txt:#ece8ff; --muted:#8a82b8;
  --pink:#ff3d8b; --pink-glow:#ff6bb5;
  --cyan:#4dd0ff; --yellow:#ffd84d; --green:#4dffa1; --red:#ff5a5a;
}
*{margin:0;padding:0;box-sizing:border-box}
button{font:inherit}
html,body{height:100vh;width:100vw;overflow:hidden;font-family:'Mali','Noto Sans Thai',sans-serif;background:var(--bg-0);color:var(--txt);user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,61,139,.08),transparent 50%),radial-gradient(circle at 80% 70%,rgba(77,208,255,.08),transparent 50%);pointer-events:none}
#app{position:relative;z-index:1;height:100vh;width:100vw;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}

.topics-bar{display:flex;gap:6px;padding:8px 12px;background:linear-gradient(180deg,rgba(22,18,40,.95),rgba(16,12,30,.95));border-bottom:1px solid var(--line);backdrop-filter:blur(8px);align-items:center;overflow-x:auto}
.topics-bar::-webkit-scrollbar{height:4px}
.topics-bar::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.brand{font-weight:800;font-size:14px;padding:6px 10px;background:linear-gradient(135deg,var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.topic-btn{padding:5px 11px;background:rgba(42,36,85,.6);color:var(--muted);border:1px solid var(--line);border-radius:14px;cursor:pointer;font-size:11.5px;font-weight:500;transition:all .2s ease;white-space:nowrap}
.topic-btn:hover{background:rgba(60,50,120,.8);color:var(--txt)}
.topic-btn.active{background:linear-gradient(135deg,var(--pink),#c92d6e);color:#fff;border-color:var(--pink);box-shadow:0 0 12px rgba(255,61,139,.5)}
.topic-btn.done::after{content:' ✓';color:var(--green)}
.spacer{flex:1}
.stars-display{display:flex;align-items:center;gap:4px;padding:4px 10px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;font-size:12px;color:var(--yellow);white-space:nowrap}
.stars-display .star{font-size:14px}
.stars-display .star.empty{color:#444}
.settings-btn{background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--muted);padding:5px 10px;border-radius:12px;cursor:pointer;font-size:12px}
.settings-btn:hover{color:var(--txt)}

.main{display:grid;grid-template-columns:1fr 230px;gap:12px;padding:12px;overflow:hidden;min-height:0}
.card{background:linear-gradient(135deg,rgba(31,26,58,.9),rgba(22,18,40,.95));border:1px solid var(--line);border-radius:18px;padding:24px 28px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pink),var(--cyan),var(--yellow))}
.slide-content{flex:1;overflow-y:auto;padding-right:6px;scrollbar-width:thin}
.slide-content::-webkit-scrollbar{width:5px}
.slide-content::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

@keyframes slideEnter{0%{opacity:0;transform:translateX(40px) scale(.98);filter:blur(4px)}100%{opacity:1;transform:translateX(0) scale(1);filter:blur(0)}}
.slide-content>*{animation:slideEnter .5s cubic-bezier(.22,.61,.36,1) both}
.slide-content>*:nth-child(2){animation-delay:.08s}
.slide-content>*:nth-child(3){animation-delay:.16s}
.slide-content>*:nth-child(4){animation-delay:.24s}
.slide-content>*:nth-child(5){animation-delay:.32s}

.slide-header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.slide-num{font-size:11px;color:var(--muted);background:rgba(0,0,0,.3);padding:3px 8px;border-radius:8px;letter-spacing:1px;margin-left:auto}
.slide-title{font-size:21px;font-weight:700;color:var(--txt);line-height:1.2}
.slide-section-tag{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--pink);margin-bottom:4px}
.slide-body{font-size:14.5px;line-height:1.65;color:var(--txt)}
.slide-body p{margin-bottom:8px}
.lesson-visual{display:block;float:right;width:min(34%,320px);height:auto;max-height:240px;object-fit:contain;object-position:center;margin:0 0 12px 18px;border-radius:14px;border:1px solid var(--line)}
.lesson-visual-small{width:min(24%,220px);max-height:170px}
.lesson-visual-centered{display:block;float:none;width:min(48%,420px);max-height:270px;margin:12px auto}
@media(max-width:880px){.lesson-visual{float:none;width:100%;margin:12px 0 0}.lesson-visual-centered{width:100%}}
.slide-body ul,.slide-body ol{margin:6px 0 10px 22px}
.slide-body li{margin-bottom:4px}
.slide-body code,.math{font-family:'JetBrains Mono','Consolas',monospace;background:rgba(255,61,139,.12);color:var(--pink-glow);padding:2px 7px;border-radius:5px;font-size:13.5px;border:1px solid rgba(255,61,139,.3)}
.example-box{margin:12px 0;padding:12px 14px;background:rgba(77,208,255,.06);border-left:3px solid var(--cyan);border-radius:0 10px 10px 0}
.example-box .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--cyan);margin-bottom:5px;font-weight:700}
.tip-box{margin:12px 0;padding:10px 14px;background:rgba(255,216,77,.07);border-left:3px solid var(--yellow);border-radius:0 10px 10px 0;font-size:13.5px}
.tip-box .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--yellow);margin-bottom:4px;font-weight:700}

.side{display:grid;grid-template-rows:auto auto 1fr;gap:10px;min-height:0}
.hangman-box{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column}
.hangman-box .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.hangman-count{color:var(--pink);font-weight:700}
.hangman-svg{width:100%;height:130px;background:rgba(0,0,0,.2);border-radius:8px}

.combo-box{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12px}
.combo-value{font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--pink),var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.combo-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-top:4px}

.stats-box{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:11px}
.stats-box .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}

.quiz-question{font-size:17px;font-weight:600;margin-bottom:16px;line-height:1.5}
.quiz-options{display:grid;gap:9px}
.quiz-option{padding:12px 16px;background:rgba(42,36,85,.4);border:1.5px solid var(--line);border-radius:11px;cursor:pointer;transition:all .2s ease;font-size:14.5px;display:flex;align-items:center;gap:12px}
.quiz-option:hover:not(.wrong):not(.correct):not(.disabled){background:rgba(60,50,120,.6);border-color:var(--cyan);transform:translateX(4px)}
.quiz-option .letter{width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.quiz-option.wrong{background:rgba(255,90,90,.12);border-color:var(--red);opacity:.55;cursor:not-allowed}
.quiz-option.wrong .letter{background:var(--red);color:#fff}
.quiz-option.wrong::after{content:'✗';margin-left:auto;color:var(--red);font-weight:700}
.quiz-option.correct{background:rgba(77,255,161,.12);border-color:var(--green)}
.quiz-option.correct .letter{background:var(--green);color:#052}
.quiz-option.correct::after{content:'✓';margin-left:auto;color:var(--green);font-weight:700;font-size:18px}
.quiz-option.disabled{cursor:not-allowed}
.quiz-feedback{margin-top:12px;padding:10px 14px;border-radius:9px;font-size:13.5px;display:none}
.quiz-feedback.show{display:block;animation:slideEnter .4s ease both}
.quiz-feedback.correct{background:rgba(77,255,161,.1);border:1px solid var(--green);color:var(--green)}
.quiz-feedback.wrong{background:rgba(255,90,90,.1);border:1px solid var(--red);color:var(--red)}

.bottom-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(0deg,rgba(22,18,40,.95),rgba(16,12,30,.95));border-top:1px solid var(--line);gap:12px}
.nav-btn{padding:8px 18px;background:linear-gradient(135deg,var(--pink),#c92d6e);color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:13.5px;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:6px}
.nav-btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,61,139,.4)}
.nav-btn:disabled{opacity:.35;cursor:not-allowed}
.nav-btn.secondary{background:rgba(42,36,85,.7);border:1px solid var(--line)}
.nav-btn.secondary:hover:not(:disabled){background:rgba(60,50,120,.8);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.progress-bar{flex:1;height:6px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan));width:0%;transition:width .4s ease;border-radius:3px}
.progress-text{font-size:11px;color:var(--muted);white-space:nowrap}

.combo-overlay{position:fixed;inset:0;pointer-events:none;z-index:100;display:none;align-items:center;justify-content:center}
.combo-overlay.show{display:flex}
.combo-text{font-size:110px;font-weight:900;color:var(--pink);text-shadow:0 0 8px #fff,0 0 16px var(--pink),0 0 30px var(--pink),0 0 50px var(--pink-glow),0 0 80px var(--pink-glow);animation:comboFlicker .6s ease both}
@keyframes comboFlicker{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1;text-shadow:0 0 8px #fff,0 0 16px var(--pink),0 0 30px var(--pink),0 0 50px var(--pink-glow),0 0 80px var(--pink-glow)}20%,24%,55%{opacity:.3;text-shadow:0 0 16px var(--pink),0 0 40px var(--pink)}}
@keyframes comboPop{0%{transform:scale(.3) rotate(-15deg);opacity:0}60%{transform:scale(1.2) rotate(5deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
.combo-emoji{position:absolute;font-size:70px;top:30%;left:50%;transform:translate(-50%,-50%);animation:comboPop .6s ease}
.sparkle{position:absolute;width:8px;height:8px;border-radius:50%;animation:sparkleFloat 1s ease-out forwards}
@keyframes sparkleFloat{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:200;animation:fadeIn .3s ease}
.modal-backdrop.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(135deg,var(--bg-2),var(--bg-1));border:1px solid var(--pink);border-radius:20px;padding:28px;max-width:460px;text-align:center;box-shadow:0 0 60px rgba(255,61,139,.4);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalIn{from{transform:scale(.8) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal h2{font-size:24px;margin-bottom:12px;color:var(--pink);text-shadow:0 0 12px var(--pink-glow)}
.modal p{color:var(--txt);margin-bottom:14px;line-height:1.6;font-size:14px}
.modal .stars-lost{font-size:32px;color:var(--yellow);margin:10px 0}
.modal.nt{border-color:var(--red);box-shadow:0 0 80px rgba(255,90,90,.6)}
.modal.nt h2{color:var(--red);text-shadow:0 0 16px var(--red);font-size:42px;letter-spacing:6px;animation:ntFlicker .4s infinite alternate}
@keyframes ntFlicker{from{text-shadow:0 0 16px var(--red);opacity:.85}to{text-shadow:0 0 30px var(--red),0 0 50px #ff8888;opacity:1}}
.modal .modal-btn{margin-top:8px}

.hangman-svg .part{opacity:0;transition:opacity .3s}
.hangman-svg .part.on{opacity:1;animation:draw .5s ease both}
@keyframes draw{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.hangman-svg .frame{stroke:var(--muted);stroke-width:2;fill:none}
.hangman-svg .body-part{stroke:var(--pink);stroke-width:2.5;fill:none;stroke-linecap:round}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}

@media(max-width:880px){.main{grid-template-columns:1fr}.side{display:none}.combo-text{font-size:70px}}
</style>
</head>
<body>
<div id="app">
  <div class="topics-bar" id="topicsBar">
    <span class="brand">⚡ Alge-Buddy</span>
    <div class="spacer"></div>
    <div class="stars-display" id="starsDisplay"></div>
    <button class="settings-btn" onclick="settings()">⚙</button>
  </div>
  <div class="main">
    <div class="card" id="card"></div>
    <div class="side">
      <div class="hangman-box">
        <div class="label"><span>Hangman</span><span class="hangman-count" id="hangmanCount">0/11</span></div>
        <svg class="hangman-svg" id="hangmanSvg" viewBox="0 0 120 160">
          <line class="frame" x1="10" y1="150" x2="90" y2="150"/>
          <line class="frame" x1="30" y1="150" x2="30" y2="10"/>
          <line class="frame" x1="30" y1="10" x2="80" y2="10"/>
          <line class="frame" x1="80" y1="10" x2="80" y2="25"/>
          <circle class="part body-part" id="p0" cx="80" cy="35" r="10"/>
          <line class="part body-part" id="p1" x1="80" y1="45" x2="80" y2="85"/>
          <line class="part body-part" id="p2" x1="80" y1="58" x2="65" y2="72"/>
          <line class="part body-part" id="p3" x1="80" y1="58" x2="95" y2="72"/>
          <line class="part body-part" id="p4" x1="80" y1="85" x2="68" y2="110"/>
          <line class="part body-part" id="p5" x1="80" y1="85" x2="92" y2="110"/>
          <path class="part body-part" id="p6" d="M70 28 Q80 16 90 28"/>
          <circle class="part body-part" id="p7" cx="76" cy="34" r="1.6" fill="#ff3d8b"/>
          <circle class="part body-part" id="p8" cx="84" cy="34" r="1.6" fill="#ff3d8b"/>
          <path class="part body-part" id="p9" d="M75 41 Q80 45 85 41"/>
          <path class="part body-part" id="p10" d="M70 48 L75 46 M85 46 L90 48" stroke-width="1.2"/>
        </svg>
      </div>
      <div class="combo-box">
        <div class="combo-label">Combo Streak</div>
        <div class="combo-value" id="comboValue">0</div>
        <div class="combo-label" id="comboBest">Best: 0</div>
      </div>
      <div class="stats-box">
        <div class="label">Today</div>
        <div id="dailyStats" style="color:var(--muted);font-size:12px;line-height:1.6"></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn secondary" onclick="prev()">◀ Prev</button>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-text" id="progressText">1 / 1</span>
    <button class="nav-btn" id="nextBtn" onclick="next()">Next ▶</button>
  </div>
</div>

<div class="combo-overlay" id="comboOverlay"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ============= SLIDE DATA =============
const slides = [];
let _id = 0;
const nextId = () => 's' + String(++_id).padStart(3,'0');

const L = (section, title, body, opts={}) => slides.push({
  id: nextId(), type:'lesson', section, title, body,
  example: opts.example || '', tip: opts.tip || ''
});

const Q = (section, title, question, options, answer, opts={}) => slides.push({
  id: nextId(), type:'quiz', section, title,
  question, options, answer,
  hint: opts.hint || '', explain: opts.explain || ''
});

// ===== SECTION 1: 10.0 Getting Started =====
L('10.0 Getting Started','Chapter 10: Manipulating Expressions',`
  <p>Welcome to <strong>Chapter 10</strong>! In this chapter, you will learn how to manipulate algebraic expressions.</p>
  <h3 style="color:var(--cyan);margin-top:12px;">You will learn how to:</h3>
  <ul>
    <li>Understand how to manipulate algebraic expressions, including:</li>
    <li style="margin-left:18px;">→ collecting like terms</li>
    <li style="margin-left:18px;">→ applying the distributive law with a constant</li>
  </ul>
`);

L('10.0 Getting Started','Starting Point — Algebra in Real Life',`
  <img class="lesson-visual" src="assets/01_number_machine.svg" alt="Number machine showing double a number, then add 5">
  <p><strong>Do you remember how to write an algebraic expression to represent something in real-life?</strong></p>
  <div class="example-box">
    <div class="label">Example</div>
    <p>You think of a number. You double the number and then add 5.</p>
    <p>You can write the new number as <span class="math">2m + 5</span>, where <span class="math">m</span> represents your original number.</p>
  </div>
`);

Q('10.0 Getting Started','Quick Check 1',
  'You think of a number <code>n</code>, then add 7. What is the new number?',
  ['n + 7','7n','n − 7','7 − n'], 0,
  {explain:'Adding 7 to n gives n + 7.'});

// ============= STATE & CONFIG =============
const C = {
  maxCombo: 20, stars: 3, maxWrong: 2
};

let state = {
  permanent: { soundOn: true, correctQuizIds: [], bestCombo: 0, comboStreak: 0, lastSlide: null, wrongChoices: {} },
  daily: { stars: C.stars, correctToday: 0, attempted: [] }
};

let audioContext = null;
let currentIndex = 0;

// ============= HELPERS =============
function save() {
  localStorage.setItem('mathgame', JSON.stringify(state));
}

function load() {
  const s = JSON.parse(localStorage.getItem('mathgame') || '{}');
  state.permanent = { ...state.permanent, ...(s.permanent || {}) };
  state.daily = { ...state.daily, ...(s.daily || {}) };
  state.permanent.correctQuizIds = Array.isArray(s.permanent?.correctQuizIds) ? s.permanent.correctQuizIds : [];
  state.permanent.wrongChoices = s.permanent?.wrongChoices || {};
  state.permanent.soundOn = Boolean(s.permanent?.soundOn);
  state.permanent.comboStreak = Math.max(0, Number(s.permanent?.comboStreak) || 0);
  state.permanent.bestCombo = Math.max(state.permanent.comboStreak, Number(s.permanent?.bestCombo) || 0);
  state.daily.stars = Math.max(0, Math.min(C.stars, Number(s.daily?.stars) || 0));
  state.daily.correctToday = Math.max(0, Number(s.daily?.correctToday) || 0);
  state.daily.attempted = Array.isArray(s.daily?.attempted) ? s.daily.attempted : [];
}

function playSound(kind) {
  if (!state.permanent.soundOn) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  audioContext ||= new Audio();
  if (audioContext.state === 'suspended') audioContext.resume();
  const now = audioContext.currentTime;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.type = kind === 'correct' ? 'sine' : 'triangle';
  oscillator.frequency.setValueAtTime(kind === 'correct' ? 660 : 180, now);
  oscillator.frequency.exponentialRampToValueAtTime(kind === 'correct' ? 880 : 90, now + .2);
  gain.gain.setValueAtTime(.0001, now);
  gain.gain.exponentialRampToValueAtTime(.06, now + .02);
  gain.gain.exponentialRampToValueAtTime(.0001, now + .25);
  oscillator.connect(gain).connect(audioContext.destination);
  oscillator.start(now);
  oscillator.stop(now + .27);
}

// ============= RENDER =============
function renderSlide(i) {
  const card = document.getElementById('card');
  const s = slides[i];
  if (!s) return;

  let html = `<div class="slide-content"><div class="slide-header">
    <span class="slide-section-tag">${s.section}</span>
    <span class="slide-num">${i+1}/${slides.length}</span>
  </div>`;

  if (s.type === 'lesson') {
    html += `<div class="slide-title">${s.title}</div>
    <div class="slide-body">${s.body}</div>`;
  } else if (s.type === 'quiz') {
    const isAnswered = state.permanent.correctQuizIds.includes(s.id);
    html += `<div class="slide-title">${s.title}</div>
    <div class="quiz-question">${s.question}</div>
    <div class="quiz-options">`;
    s.options.forEach((opt, idx) => {
      const isCorrect = idx === s.answer;
      const isWrong = (state.permanent.wrongChoices[s.id] || []).includes(idx);
      let cls = '';
      if (isAnswered && isCorrect) cls = ' correct';
      else if (isWrong) cls = ' wrong';
      html += `<div class="quiz-option${cls}" onclick="answer(${idx})" ${isAnswered || isWrong ? 'style="pointer-events:none"' : ''}>
        <div class="letter">${String.fromCharCode(65+idx)}</div>
        <div>${opt}</div>
      </div>`;
    });
    html += `</div>`;
    if (state.permanent.correctQuizIds.includes(s.id)) {
      html += `<div class="quiz-feedback show correct">✓ Correct! ${s.explain}</div>`;
    }
  }

  html += `</div>`;
  card.innerHTML = html;

  // Update progress
  document.getElementById('progressFill').style.width = ((i+1)/slides.length*100) + '%';
  document.getElementById('progressText').textContent = `${i+1} / ${slides.length}`;

  // Update nav buttons
  const prevBtn = document.querySelector('.nav-btn.secondary');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.disabled = i === 0;
  if (slides[i].type === 'quiz') {
    nextBtn.disabled = !state.permanent.correctQuizIds.includes(slides[i].id);
  } else {
    nextBtn.disabled = i === slides.length - 1;
  }

  // Update stats
  updateStats();
}

function updateStats() {
  const stats = document.getElementById('dailyStats');
  stats.innerHTML = `
    ✓ Correct: ${state.daily.correctToday}<br>
    📊 Attempted: ${state.daily.attempted.length}<br>
    ⭐ Stars: ${state.daily.stars}/${C.stars}
  `;
  
  const comboVal = document.getElementById('comboValue');
  const comboBest = document.getElementById('comboBest');
  comboVal.textContent = state.permanent.comboStreak;
  comboBest.textContent = `Best: ${state.permanent.bestCombo}`;
}

// ============= NAVIGATION =============
function go(i) {
  currentIndex = Math.max(0, Math.min(slides.length - 1, i));
  state.permanent.lastSlide = slides[currentIndex].id;
  save();
  renderSlide(currentIndex);
}

function next() {
  const s = slides[currentIndex];
  if (s && s.type === 'quiz' && !state.permanent.correctQuizIds.includes(s.id)) {
    const card = document.getElementById('card');
    card.classList.add('shake');
    setTimeout(() => card.classList.remove('shake'), 400);
    return;
  }
  if (currentIndex < slides.length - 1) {
    go(currentIndex + 1);
  }
}

function prev() {
  if (currentIndex > 0) {
    go(currentIndex - 1);
  }
}

// ============= QUIZ =============
function answer(optIdx) {
  const s = slides[currentIndex];
  if (!s || s.type !== 'quiz') return;
  if (state.permanent.correctQuizIds.includes(s.id)) return;
  if ((state.permanent.wrongChoices[s.id] || []).includes(optIdx)) return;

  if (optIdx === s.answer) {
    state.permanent.correctQuizIds.push(s.id);
    state.daily.correctToday++;
    if (!state.daily.attempted.includes(s.id)) state.daily.attempted.push(s.id);
    state.permanent.comboStreak++;
    state.permanent.bestCombo = Math.max(state.permanent.bestCombo, state.permanent.comboStreak);
    state.daily.stars = Math.max(0, state.daily.stars);
    playSound('correct');
  } else {
    if (!state.permanent.wrongChoices[s.id]) state.permanent.wrongChoices[s.id] = [];
    state.permanent.wrongChoices[s.id].push(optIdx);
    if (state.permanent.wrongChoices[s.id].length >= C.maxWrong) {
      state.permanent.comboStreak = 0;
      state.daily.stars--;
      playSound('wrong');
    } else {
      playSound('wrong');
    }
  }
  save();
  renderSlide(currentIndex);
}

function settings() {
  state.permanent.soundOn = !state.permanent.soundOn;
  save();
  alert('Sound: ' + (state.permanent.soundOn ? 'ON' : 'OFF'));
}

// ============= INIT =============
load();
renderSlide(0);
</script>
</body>
</html>
