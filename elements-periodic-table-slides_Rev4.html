<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elements and the Periodic Table — Interactive Lesson</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Sarabun:wght@400;600;700&display=swap');

:root {
  --bg: #FFF9F4;
  --bg-2: #FFF3E9;
  --text: #2D3047;
  --muted: #6B7280;
  --pink: #FF7E6B;
  --yellow: #FFD93D;
  --mint: #5DEBC9;
  --blue: #4F9DFF;
  --purple: #B388FF;
  --orange: #FF9F43;
  --shadow: 6px 6px 0px rgba(45, 48, 71, 0.15);
  --shadow-sm: 3px 3px 0px rgba(45, 48, 71, 0.1);
  --radius: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%; height: 100dvh;
  overflow: hidden; overscroll-behavior: none;
  font-family: 'Mali', 'Sarabun', cursive;
  background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
  color: var(--text);
}
body { position: fixed; inset: 0; }

/* Decorative Blobs */
.blob {
  position: fixed; border-radius: 50%; filter: blur(60px);
  opacity: 0.35; z-index: -1; animation: float 12s infinite ease-in-out;
}
.blob-1 { width: 400px; height: 400px; background: var(--mint); top: -100px; left: -100px; }
.blob-2 { width: 500px; height: 500px; background: var(--yellow); bottom: -150px; right: -150px; animation-delay: 2s; }
.blob-3 { width: 300px; height: 300px; background: var(--pink); top: 30%; left: 60%; animation-delay: 4s; }
.blob-4 { width: 250px; height: 250px; background: var(--purple); top: 60%; left: 10%; animation-delay: 6s; }

@keyframes float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(30px, -40px) scale(1.05); }
}

/* Progress Bar */
.progress-container {
  position: fixed; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  width: min(52%, 560px); height: 10px;
  background: white; border: 3px solid var(--text); border-radius: 20px;
  overflow: hidden; z-index: 100; box-shadow: var(--shadow-sm);
}
.progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--pink), var(--yellow), var(--mint), var(--blue), var(--purple));
  background-size: 200% 100%;
  animation: shimmer 3s linear infinite;
  transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}
@keyframes shimmer { 0% {background-position: 0% 0%;} 100% {background-position: 200% 0%;} }

/* Star System (Daily Stars) */
.star-counter {
  position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 16px;
  background: white; border: 2px solid var(--text); border-radius: 20px;
  padding: 4px 12px; font-size: 0.72rem; font-weight: 700; z-index: 100;
  box-shadow: var(--shadow-sm); display: flex; gap: 6px; align-items: center;
  max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.star-counter .stars { color: var(--orange); letter-spacing: 1px; }

/* Topics */
#topics {
  position: fixed; top: calc(28px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px; z-index: 100;
  max-width: calc(100% - 280px); overflow-x: auto; overflow-y: hidden; padding: 3px;
  scrollbar-width: none; white-space: nowrap;
}
#topics::-webkit-scrollbar { display: none; }
.topic-pill {
  flex: none; border: 2px solid var(--text); background: white; color: var(--text);
  padding: 4px 10px; border-radius: 20px; font-family: 'Mali', cursive;
  font-weight: 700; font-size: 0.72rem; line-height: 1.15; cursor: pointer; transition: all 0.2s;
  box-shadow: 2px 2px 0px var(--text);
}
.topic-pill:hover { background: var(--yellow); transform: translateY(-2px); }
.topic-pill.active { background: var(--blue); color: white; }

/* Deck & Slides */
#deck {
  position: relative; width: 100%; height: 100vh; height: 100dvh;
  display: flex; justify-content: center; align-items: center;
  padding: calc(62px + env(safe-area-inset-top)) 0 calc(54px + env(safe-area-inset-bottom));
  overflow: hidden;
}
.slide {
  position: absolute; width: 94%; max-width: 1280px;
  height: calc(100dvh - 126px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  max-height: calc(100% - 126px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  background: white; border-radius: var(--radius); border: 4px solid var(--text);
  box-shadow: var(--shadow); padding: clamp(14px, 2.4vw, 30px);
  display: flex; flex-direction: column;
  opacity: 0; transform: translateX(60px) scale(0.95);
  transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
  pointer-events: none; overflow: hidden;
}
.slide.active { opacity: 1; transform: translateX(0) scale(1); pointer-events: auto; }
.slide.exit { opacity: 0; transform: translateX(-60px) scale(0.95); }
.slide.title {
  background: linear-gradient(135deg, #FFE5DE 0%, #FFF9C4 50%, #D4F5FF 100%);
  justify-content: center; align-items: center; text-align: center;
}
.slide.final {
  background: linear-gradient(135deg, #D4F5FF 0%, #E5D4FF 100%);
  justify-content: center; align-items: center; text-align: center;
}
.slide.dyk { background: linear-gradient(135deg, #FFF9C4 0%, #FFE5DE 100%); }

/* Typography */
.eyebrow {
  display: inline-block; background: var(--yellow); color: var(--text);
  padding: 6px 16px; border-radius: 20px; font-weight: 700; margin-bottom: 20px;
  border: 2px solid var(--text); box-shadow: 2px 2px 0px var(--text);
  font-size: 0.9rem; text-transform: uppercase; align-self: flex-start;
}
.eyebrow.dyk-tag { background: var(--orange); color: white; }
.eyebrow.quiz-tag { background: var(--purple); color: white; }
h1 { font-size: 3.2rem; line-height: 1.1; color: var(--blue); margin-bottom: 15px; text-shadow: 3px 3px 0 rgba(0,0,0,0.1); }
h2 { font-size: 2.2rem; line-height: 1.2; color: var(--text); margin-bottom: 16px; }
.lead { font-size: 1.15rem; line-height: 1.6; color: var(--muted); margin-bottom: 16px; }

.content-grid {
  display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 24px;
  align-items: center; flex: 1; min-height: 0;
}
.points { list-style: none; display: flex; flex-direction: column; gap: 15px; }
.points li {
  font-size: 1.15rem; font-weight: 600; background: #FAFAFA;
  border: 2px solid var(--text); border-radius: 12px; padding: 12px 15px;
  box-shadow: 3px 3px 0px var(--text); display: flex; align-items: center;
}
.points li::before {
  content: "•"; color: var(--pink); font-size: 2rem; margin-right: 10px; line-height: 1;
}

/* Visual Area */
.visual {
  display: flex; justify-content: center; align-items: center;
  background: #F0F4FF; border: 3px dashed var(--blue); border-radius: 20px;
  padding: 20px; min-height: 0; height: min(100%, 360px); text-align: center;
}
.dyk .visual { background: #FFF9C4; border-color: var(--yellow); }
.slide.photo-story .content-grid { grid-template-columns: 0.82fr 1.18fr; }
.slide.photo-story .visual, .slide.experiment .visual {
  padding: 0; overflow: hidden; border-style: solid; height: 100%;
}
.lesson-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.slide.experiment .content-grid { grid-template-columns: 0.9fr 1.1fr; }
.slide.experiment .visual { border-color: var(--mint); }
.slide.challenge .content-grid {
  grid-template-columns: 1fr 1fr; border: 3px solid var(--text);
  border-radius: 20px; overflow: hidden; gap: 0;
}
.slide.challenge .points { padding: 18px; }
.slide.challenge .visual { height: 100%; border: 0; border-left: 3px dashed var(--text); border-radius: 0; background: #FAFAFA; }
.evidence-strip {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%;
}
.evidence-card {
  background: white; border: 2px solid var(--text); border-radius: 12px;
  padding: 10px 8px; box-shadow: 2px 2px 0 var(--text); text-align: center;
}
.evidence-card b { display: block; color: var(--blue); margin-bottom: 4px; }

/* Custom CSS Graphics */
.elem-cards { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
.elem-card {
  width: 90px; background: white; border: 3px solid var(--text); border-radius: 12px;
  padding: 10px; box-shadow: 4px 4px 0px var(--text); transition: transform 0.2s;
  display: flex; flex-direction: column; align-items: center;
}
.elem-card:hover { transform: translateY(-5px) rotate(-2deg); }
.elem-num { font-size: 0.8rem; color: var(--muted); align-self: flex-start; }
.elem-sym { font-size: 2.5rem; font-weight: 700; line-height: 1; margin: 5px 0; color: var(--blue); }
.elem-card.alt .elem-sym { color: var(--pink); }
.elem-card.alt2 .elem-sym { color: var(--purple); }
.elem-name { font-size: 0.8rem; font-weight: 600; }

.atom-container { position: relative; width: 180px; height: 180px; }
.nucleus {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 40px; height: 40px; background: var(--pink); border-radius: 50%;
  border: 3px solid var(--text); z-index: 2; animation: pulse 2s infinite ease-in-out;
}
.orbit-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.orbit-wrap-1 { animation: spin 6s linear infinite; }
.orbit-wrap-2 { animation: spin 8s linear infinite reverse; }
.orbit-wrap-3 { animation: spin 10s linear infinite; }
.orbit-line { width: 100%; height: 100%; border: 2px dashed var(--blue); border-radius: 50%; opacity: 0.7; }
.orbit-wrap-2 .orbit-line { border-color: var(--purple); }
.orbit-wrap-3 .orbit-line { border-color: var(--mint); }
.electron { position: absolute; top: -10px; left: 50%; margin-left: -10px; width: 20px; height: 20px; background: var(--blue); border-radius: 50%; border: 2px solid var(--text); z-index: 2; }
.orbit-wrap-2 .electron { background: var(--purple); }
.orbit-wrap-3 .electron { background: var(--mint); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.1); } }

.chem-formula {
  font-size: 3.5rem; font-weight: 700; color: var(--text);
  background: white; padding: 20px 30px; border: 4px solid var(--text);
  border-radius: 16px; box-shadow: 6px 6px 0px var(--text);
  margin-bottom: 15px;
}
.chem-formula sub { font-size: 0.6em; color: var(--pink); }
.formula-caption { font-size: 1.2rem; font-weight: 600; color: var(--blue); }

.molecule { display: flex; align-items: center; justify-content: center; gap: 10px; }
.atom-circle {
  width: 50px; height: 50px; border-radius: 50%; border: 3px solid var(--text);
  display: flex; align-items: center; justify-content: center; font-weight: 700;
  color: white; box-shadow: 3px 3px 0px var(--text);
}
.bond-line { width: 20px; height: 4px; background: var(--text); }

.comp-table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
.comp-table th {
  background: var(--text); color: white; padding: 10px; font-size: 1.1rem;
  border-radius: 8px; text-align: left;
}
.comp-table td {
  background: white; border: 2px solid var(--text); padding: 12px; font-size: 1rem;
}
.comp-table td:first-child { border-right: none; border-radius: 8px 0 0 8px; font-weight: 700; background: #FAFAFA; }
.comp-table td:last-child { border-left: none; border-radius: 0 8px 8px 0; }

/* Quiz Style */
.quiz-content { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; align-items: center; }
.quiz-main { min-width: 0; }
.options { display: grid; gap: 15px; grid-template-columns: 1fr 1fr; margin-top: 20px; }
.option {
  background: white; border: 3px solid var(--text); padding: 15px; border-radius: 12px;
  font-family: 'Mali', cursive; font-size: 1.1rem; font-weight: 600; cursor: pointer;
  transition: all 0.2s; box-shadow: 3px 3px 0px var(--text); text-align: left; color: var(--text);
}
.option:hover { background: var(--yellow); transform: translate(-2px, -2px); box-shadow: 5px 5px 0px var(--text); }
.option.correct { background: var(--mint); }
.option.wrong { background: var(--pink); color: white; }
.option:disabled { cursor: not-allowed; opacity: 0.8; }
.feedback { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: var(--text); }
.hangman { text-align: center; }
.hangman svg { display: block; width: 100%; max-height: 230px; }
.gallows, .hm-part {
  fill: none; stroke: var(--text); stroke-width: 5; stroke-linecap: round;
}
.gallows { opacity: 0.25; }
.hm-part { opacity: 0; stroke-dasharray: 240; stroke-dashoffset: 240; }
.hm-part.drawn { opacity: 1; animation: drawHangman 0.55s ease forwards; }
@keyframes drawHangman { to { stroke-dashoffset: 0; } }
.hangman small { font-weight: 700; }

/* Modal */
.modal {
  position: fixed; inset: 0; background: rgba(45, 48, 71, 0.6);
  display: none; justify-content: center; align-items: center; z-index: 200;
  backdrop-filter: blur(4px);
}
.modal.show { display: flex; }
.modal-content {
  background: white; padding: 30px 40px; border-radius: 24px; border: 4px solid var(--text);
  box-shadow: var(--shadow); text-align: center; max-width: 90%;
}
.modal-content h2 { color: var(--pink); margin-bottom: 10px; }
.modal-content p { margin-bottom: 20px; font-size: 1.1rem; line-height: 1.5; }

/* Thai Summary Bar */
.th-bar {
  position: fixed; bottom: calc(8px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  width: min(58%, 620px); background: #FFF9C4; border: 2px solid var(--text);
  border-radius: 12px; padding: 4px 8px; box-shadow: 3px 3px 0px var(--text);
  font-weight: bold; color: var(--text); z-index: 50; display: flex; align-items: center;
  gap: 6px; font-size: 0.7rem;
}
.th-bar .th-icon { font-size: 0.9rem; }
.th-bar .th-text {
  flex: 1; line-height: 1.15; text-align: center;
  overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp: 2; line-clamp: 2;
}

/* Controls */
.controls {
  position: fixed; left: 0; bottom: calc(6px + env(safe-area-inset-bottom)); width: 100%;
  display: flex; justify-content: space-between; gap: 20px; z-index: 100;
  padding: 0 max(12px, 2.5vw); pointer-events: none;
}
.btn {
  background: white; border: 3px solid var(--text); padding: 7px 16px;
  font-family: 'Mali', cursive; font-size: 0.88rem; font-weight: 700; border-radius: 50px;
  cursor: pointer; box-shadow: 4px 4px 0px var(--text); transition: all 0.1s; color: var(--text);
  display: flex; align-items: center; gap: 8px; pointer-events: auto;
}
.btn.primary { background: var(--mint); }
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--text); }
.btn:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0px var(--text); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0px var(--text); }

/* Animations */
.slide.active .anim-up { animation: animUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) backwards; }
.slide.active .anim-up:nth-child(1) { animation-delay: 0.1s; }
.slide.active .anim-up:nth-child(2) { animation-delay: 0.2s; }
.slide.active .anim-up:nth-child(3) { animation-delay: 0.3s; }
.slide.active .anim-up:nth-child(4) { animation-delay: 0.4s; }
@keyframes animUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

@media (min-width: 601px) and (max-width: 1366px) {
  #deck { padding-top: calc(58px + env(safe-area-inset-top)); padding-bottom: calc(52px + env(safe-area-inset-bottom)); }
  .slide { width: calc(100% - 40px); height: calc(100dvh - 120px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); max-height: calc(100% - 120px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); padding: clamp(14px, 2vw, 22px); }
  h1 { font-size: clamp(2rem, 4vw, 2.7rem); } h2 { font-size: clamp(1.55rem, 3vw, 2rem); margin-bottom: 12px; }
  .eyebrow { padding: 4px 11px; margin-bottom: 10px; font-size: 0.72rem; }
  .lead { font-size: 1rem; line-height: 1.4; margin-bottom: 10px; }
  .content-grid { gap: 18px; } .points { gap: 9px; } .points li { font-size: 0.92rem; padding: 8px 10px; }
  .visual { padding: 12px; height: min(100%, 290px); }
  .slide.photo-story .visual, .slide.experiment .visual { height: min(100%, 320px); }
  .options { gap: 9px; margin-top: 10px; } .option { padding: 10px; font-size: 0.92rem; }
  .quiz-content { grid-template-columns: minmax(0, 1fr) 180px; gap: 16px; }
  .hangman svg { max-height: 180px; } .feedback { margin-top: 10px; font-size: 0.95rem; }
  .th-bar { width: min(56%, 560px); font-size: 0.66rem; } .th-bar .th-icon { font-size: 0.82rem; }
  .btn { padding: 6px 13px; font-size: 0.8rem; }
}

@media (max-width: 600px) {
  h1 { font-size: 1.9rem; } h2 { font-size: 1.45rem; margin-bottom: 10px; }
  #topics { max-width: calc(100% - 12px); } .topic-pill { padding: 3px 8px; font-size: 0.64rem; }
  #deck { padding-top: calc(56px + env(safe-area-inset-top)); padding-bottom: calc(50px + env(safe-area-inset-bottom)); }
  .slide { width: calc(100% - 16px); height: calc(100dvh - 106px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); max-height: calc(100% - 106px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); padding: 12px; }
  .eyebrow { padding: 4px 10px; margin-bottom: 10px; font-size: 0.7rem; }
  .lead { font-size: 0.92rem; line-height: 1.35; margin-bottom: 10px; }
  .content-grid { grid-template-columns: 1fr; gap: 15px; }
  .slide.photo-story .content-grid, .slide.experiment .content-grid, .slide.challenge .content-grid { grid-template-columns: 1fr 1fr; }
  .points { gap: 8px; } .points li { font-size: 0.88rem; padding: 7px 9px; } .points li::before { font-size: 1.3rem; margin-right: 6px; }
  .visual { min-height: 100px; padding: 10px; } .options { gap: 8px; grid-template-columns: 1fr; }
  .option { padding: 9px; font-size: 0.88rem; }
  .quiz-content { grid-template-columns: minmax(0, 1fr) 118px; gap: 10px; }
  .hangman svg { max-height: 130px; } .feedback { margin-top: 10px; font-size: 0.88rem; }
  .th-bar { width: min(60%, 300px); font-size: 0.58rem; padding: 3px 6px; } .th-bar .th-icon { font-size: 0.72rem; }
  .controls { gap: 8px; padding-inline: 8px; } .btn { padding: 5px 10px; font-size: 0.72rem; }
}

@media (max-height: 700px) {
  h1 { font-size: 1.9rem; } h2 { font-size: 1.45rem; margin-bottom: 8px; }
  .eyebrow { margin-bottom: 8px; } .lead { line-height: 1.3; margin-bottom: 8px; }
  .points { gap: 7px; } .points li { padding-block: 6px; font-size: 0.85rem; }
  .visual { height: min(100%, 230px); padding: 9px; } .option { padding-block: 7px; }
  .hangman svg { max-height: 140px; }
}
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="blob blob-4"></div>

<div class="progress-container">
  <div class="progress-bar" id="progress"></div>
</div>

<div class="star-counter" id="starCounter" title="Daily Stars">
  <span class="stars" id="starDisplay">★★★★★</span>
  <span id="starText">5/5</span>
</div>

<nav id="topics"></nav>

<main id="deck"></main>

<div class="controls">
  <button class="btn" id="prev">← Prev</button>
  <button class="btn primary" id="next">Next →</button>
</div>

<div class="th-bar">
  <span class="th-icon">🇹🇭</span>
  <span class="th-text" id="thText">เริ่มบทเรียนกันเลย!</span>
</div>

<div class="modal" id="hangmanModal">
  <div class="modal-content">
    <h2>Hangman Complete!</h2>
    <p>You've accumulated 11 wrong answers. <br>You lost 1 star. But don't worry, keep learning!<br>Let's start a new Hangman.</p>
    <button class="btn primary" id="resetHangmanBtn">Start New Hangman</button>
  </div>
</div>

<script>
const Visual = {
  cards: (items) => `
    <div class="elem-cards">
      ${items.map((it, i) => `
        <div class="elem-card ${i%3===0?'alt':i%3===1?'alt2':''}">
          <span class="elem-num">${it.num}</span>
          <span class="elem-sym">${it.sym}</span>
          <span class="elem-name">${it.name}</span>
        </div>
      `).join('')}
    </div>
  `,
  atom: () => `
    <div class="atom-container">
      <div class="nucleus"></div>
      <div class="orbit-wrap orbit-wrap-1"><div class="orbit-line"></div><div class="electron"></div></div>
      <div class="orbit-wrap orbit-wrap-2"><div class="orbit-line"></div><div class="electron"></div></div>
      <div class="orbit-wrap orbit-wrap-3"><div class="orbit-line"></div><div class="electron"></div></div>
    </div>
  `,
  formula: (f, caption) => `
    <div>
      <div class="chem-formula">${f}</div>
      <div class="formula-caption">${caption}</div>
    </div>
  `,
  molecule: (parts) => `
    <div class="molecule">
      ${parts.map((p, i) => `
        <div class="atom-circle" style="background:${p.color}">${p.sym}</div>
        ${i < parts.length - 1 ? '<div class="bond-line"></div>' : ''}
      `).join('')}
    </div>
  `,
  table: (headers, rows) => `
    <table class="comp-table">
      <tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>
      ${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
    </table>
  `,

const topicStarts=[
 ["Start","Elements and the Periodic Table"],
 ["T4 · Elements","Starting Point & A Universe Made of Atoms"],
 ["T5 · Mixtures","Topic 5: Compounds and Mixtures"],
 ["T6 · Materials","Topic 6: Metals and Non-metals"],
 ["Review","End of Chapter: Physical & Chemical Properties"]
];

const topicGroups=topicStarts.map(([name,title],i)=>{
 const start=slides.findIndex(s=>s.title===title);
 const nextTitle=topicStarts[i+1]?.[1];
 const next=nextTitle?slides.findIndex(s=>s.title===nextTitle):slides.length;
 return {name,start,end:next-1};
});
const topicFor=i=>topicGroups.find(t=>i>=t.start&&i<=t.end)||topicGroups[0];

const deck=document.querySelector("#deck");
const topicsEl=document.querySelector("#topics");
const progressBar=document.getElementById("progress");
const prevBtn=document.getElementById("prev");
const nextBtn=document.getElementById("next");
const thTextEl=document.getElementById("thText");
const starDisplay=document.getElementById("starDisplay");
const starText=document.getElementById("starText");
const hangmanModal=document.getElementById("hangmanModal");
const resetHangmanBtn=document.getElementById("resetHangmanBtn");

topicsEl.addEventListener("click",e=>{const b=e.target.closest(".topic-pill");if(b)show(Number(b.dataset.start))});

function render(){
  deck.innerHTML = slides.map((s, i) => {
    if (s.type === "quiz") {
      return `
        <section class="slide" data-index="${i}" data-th="${s.th}">
          <div class="eyebrow quiz-tag anim-up">🧠 Knowledge Check</div>
          <h2 class="anim-up">${s.title}</h2>
          <div class="quiz-content anim-up">
            <div class="quiz-main">
              <p class="lead">${s.q}</p>
              <div class="options">
                ${s.opts.map((o, j) => `<button class="option" data-choice="${j}">${"ABCD"[j]}. ${o}</button>`).join("")}
              </div>
              <div class="feedback"></div>
            </div>
            <div class="hangman">${hangmanSvg()}</div>
          </div>
        </section>
      `;
    }

    let eyebrowText = "";
    if (s.type === "dyk") eyebrowText = "💡 Did You Know?";
    else if (s.type === "title") eyebrowText = "Interactive Lesson";
    else if (s.type === "final") eyebrowText = "Lesson Complete";
    else if (s.type === "photo-story") eyebrowText = "📷 Science in Real Life";
    else if (s.type === "experiment") eyebrowText = "🔎 Evidence Lab";
    else if (s.type === "challenge") eyebrowText = "🧩 Think Like a Scientist";
    else eyebrowText = `Slide ${i+1}`;

    return `
      <section class="slide ${s.type}" data-index="${i}" data-th="${s.th}">
        <div class="eyebrow anim-up ${s.type === 'dyk' ? 'dyk-tag' : ''}">${eyebrowText}</div>
        <h2 class="anim-up">${s.title}</h2>
        <div class="content-grid">
          <ul class="points anim-up">
            ${s.bullets.map(b => `<li>${b}</li>`).join("")}
          </ul>
          <div class="visual anim-up">
            ${s.visual}
          </div>
        </div>
      </section>
    `;
  }).join("");
}
render();

// Load state from localStorage
function loadState() {
  const today = new Date().toDateString();
  const saved = localStorage.getItem('scienceLessonState');
  if (saved) {
    const parsed = JSON.parse(saved);
    if (parsed.date === today) {
      return parsed;
    }
  }
  return {
    date: today,
    index: 0,
    hangman: 0,
    stars: 5,
    todayCorrect: 0,
    answered: []
  };
}

let state = loadState();
const els = [...document.querySelectorAll(".slide")];

function saveState() {
  localStorage.setItem('scienceLessonState', JSON.stringify(state));
}

function updateHangman() {
  document.querySelectorAll(".hm-part").forEach(part => {
    part.classList.toggle("drawn", Number(part.dataset.part) <= state.hangman);
  });
  document.querySelectorAll(".wrong-count").forEach(count => {
    count.textContent = state.hangman;
  });
}

function updateStars() {
  const fullStars = '★'.repeat(state.stars);
  const emptyStars = '☆'.repeat(5 - state.stars);
  starDisplay.textContent = fullStars + emptyStars;
  if (state.stars > 0) {
    starText.textContent = `${state.stars}/5`;
  } else {
    starText.textContent = `0/5 · Today: ${state.todayCorrect} correct · Keep learning!`;
  }
}

function show(index) {
  if (index < 0 || index >= slides.length) return;
  
  const currentSlide = els[state.index];
  const newSlide = els[index];
  
  if (index > state.index) {
    currentSlide.classList.add("exit");
  } else {
    currentSlide.classList.remove("active");
    currentSlide.style.transform = 'translateX(60px) scale(0.95)';
  }
  
  state.index = index;
  
  setTimeout(() => {
    els.forEach(s => {
      s.classList.remove("active", "exit");
      s.style.transform = '';
    });
    newSlide.classList.add("active");
    
    const thData = newSlide.getAttribute("data-th");
    thTextEl.innerText = thData || "บทเรียนวิทยาศาสตร์";
    updateHangman();
  }, 50);

  updateUI();
  saveState();
}

function updateUI() {
  const progress = ((state.index + 1) / slides.length) * 100;
  progressBar.style.width = `${progress}%`;

  const activeTopic = topicFor(state.index);
  document.querySelectorAll(".topic-pill").forEach(b => {
    b.classList.toggle("active", Number(b.dataset.start) === activeTopic.start);
  });
  
  prevBtn.disabled = state.index === 0;
  nextBtn.innerHTML = state.index === slides.length - 1 ? "Restart ↺" : "Next →";
}

deck.addEventListener("click", e => {
  const btn = e.target.closest(".option");
  if (!btn || btn.disabled) return;
  
  const slide = btn.closest(".slide");
  const idx = Number(slide.dataset.index);
  
  // ถ้าทำถูกแล้วจะไม่ให้กดอีก
  if (state.answered.includes(idx)) return;
  
  const q = slides[idx];
  const choice = Number(btn.dataset.choice);
  const feedback = slide.querySelector(".feedback");
  const options = slide.querySelectorAll(".option");
  
  if (choice === q.answer) {
    state.answered.push(idx);
    btn.classList.add("correct");
    state.todayCorrect++;
    feedback.innerHTML = "✅ ถูกต้อง! คิดอย่างมีหลักฐานได้ดีมาก (Correct!)";
    feedback.style.color = "var(--blue)";
    options.forEach(opt => opt.disabled = true);
    launchConfetti();
    updateStars();
  } else {
    // ถ้าผิด ไม่เฉลย แล้วให้กดตอบใหม่ได้ (ปิดแค่ปุ่มที่ผิดไป)
    btn.classList.add("wrong");
    btn.disabled = true; 
    feedback.innerHTML = "❌ ยังไม่ถูกนะ ลองตอบใหม่ได้เลย! (Not yet. Try again!)";
    feedback.style.color = "var(--pink)";
    
    // นับที่ผิดลงใน Hangman ทุกครั้ง
    if (state.hangman < 11) {
      state.hangman++;
      updateHangman();
      
      // ถ้า Hangman ครบ 11 ส่วน
      if (state.hangman === 11) {
        if (state.stars > 0) state.stars--;
        updateStars();
        hangmanModal.classList.add("show");
      }
    }
  }
  saveState();
});

resetHangmanBtn.addEventListener("click", () => {
  state.hangman = 0;
  updateHangman();
  hangmanModal.classList.remove("show");
  saveState();
});

prevBtn.addEventListener("click", () => show(state.index - 1));
nextBtn.addEventListener("click", () => {
  if (state.index === slides.length - 1) {
    state = {
      date: new Date().toDateString(),
      index: 0,
      hangman: 0,
      stars: 5,
      todayCorrect: 0,
      answered: []
    };
    document.querySelectorAll(".option").forEach(o => { o.classList.remove("correct", "wrong"); o.disabled = false; });
    document.querySelectorAll(".feedback").forEach(f => f.innerHTML = "");
    updateHangman();
    updateStars();
    show(0);
  } else {
    show(state.index + 1);
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") nextBtn.click();
  if (e.key === "ArrowLeft") prevBtn.click();
});

function launchConfetti() {
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.style.position = 'fixed';
    c.style.width = '10px'; c.style.height = '10px';
    c.style.left = '50%'; c.style.top = '50%'; c.style.zIndex = '1000';
    const colors = ['#FF7E6B', '#FFD93D', '#5DEBC9', '#4F9DFF', '#B388FF'];
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    c.style.border = '2px solid #2D3047';
    
    const angle = Math.random() * Math.PI * 2;
    const velocity = Math.random() * 300 + 100;
    const tx = Math.cos(angle) * velocity;
    const ty = Math.sin(angle) * velocity;
    
    c.animate([
      { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
      { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
    ], { duration: 1200, easing: 'cubic-bezier(0.25, 1, 0.5, 1)' });
    
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1200);
  }
}

// Initialize UI
updateHangman();
updateStars();
show(state.index);
</script>
